<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD Test - Voice Activity Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Monaco', monospace;
            background: #0a0f0f;
            color: #00ff9d;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 20px; }
        .status-card {
            background: #0d1117;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .vad-indicator {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .vad-led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: all 0.1s;
        }
        .vad-led.idle { background: #64748b; }
        .vad-led.listening { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .vad-led.speaking { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 0.3s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .vad-status-text { font-size: 18px; font-weight: bold; }
        .energy-bar {
            width: 100%;
            height: 30px;
            background: #1a2332;
            border-radius: 15px;
            overflow: hidden;
            margin: 10px 0;
        }
        .energy-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #22c55e, #3b82f6);
            transition: width 0.05s;
        }
        .transcript-box {
            background: #0a0f0f;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            min-height: 100px;
            font-size: 14px;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
        }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #1e293b; color: #94a3b8; }
        select, input {
            padding: 8px 12px;
            border-radius: 8px;
            background: #0d1117;
            border: 1px solid #2a3a4a;
            color: #00ff9d;
            font-family: inherit;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 12px;
            color: #64748b;
        }
        .log {
            background: #0d1117;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-size: 11px;
            margin-top: 15px;
        }
        .log-entry { margin: 3px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 VAD Test - Voice Activity Detection</h1>
        
        <div class="status-card">
            <div class="vad-indicator">
                <div class="vad-led idle" id="vad-led"></div>
                <span class="vad-status-text" id="vad-status">Ready</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energy-fill"></div>
            </div>
            <div class="stats">
                <span>🔊 Volume: <span id="volume-value">0%</span></span>
                <span>🎤 Frames: <span id="frame-count">0</span></span>
                <span>⏱️ Duration: <span id="duration">0s</span></span>
            </div>
            <div class="transcript-box" id="transcript">
                <span style="color:#64748b">🎤 Speak to see transcription...</span>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <button class="btn-primary" id="start-vad">🎤 Start VAD</button>
            <button class="btn-danger" id="stop-vad">⏹️ Stop</button>
            <button class="btn-secondary" id="clear-log">🗑️ Clear</button>
        </div>

        <div class="stats" style="margin-bottom: 10px;">
            <span>🤖 Mode: <select id="mode-select">
                <option value="cloud">Cloud (Gateway)</option>
                <option value="local">Local (On-Device)</option>
            </select></span>
            <span>🎙️ Threshold: <input type="range" id="threshold" min="0" max="100" value="30"></span>
            <span id="threshold-value">0.30</span>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        // DOM elements
        const vadLed = document.getElementById('vad-led');
        const vadStatusSpan = document.getElementById('vad-status');
        const energyFill = document.getElementById('energy-fill');
        const volumeSpan = document.getElementById('volume-value');
        const frameCountSpan = document.getElementById('frame-count');
        const durationSpan = document.getElementById('duration');
        const transcriptDiv = document.getElementById('transcript');
        const logDiv = document.getElementById('log');
        const startBtn = document.getElementById('start-vad');
        const stopBtn = document.getElementById('stop-vad');
        const clearBtn = document.getElementById('clear-log');
        const modeSelect = document.getElementById('mode-select');
        const thresholdSlider = document.getElementById('threshold');
        const thresholdSpan = document.getElementById('threshold-value');

        let mediaStream = null;
        let audioContext = null;
        let sourceNode = null;
        let processorNode = null;
        let isRunning = false;
        let frameCount = 0;
        let startTime = null;
        let animationId = null;
        let currentVolume = 0;
        
        // VAD state
        let isSpeaking = false;
        let silenceFrames = 0;
        let vadThreshold = 0.3;

        // Update threshold display
        thresholdSlider.addEventListener('input', (e) => {
            vadThreshold = e.target.value / 100;
            thresholdSpan.textContent = vadThreshold.toFixed(2);
            addLog(`Threshold set to ${vadThreshold.toFixed(2)}`);
        });

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span style="color:#64748b">[${time}]</span> ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateVADUI(speaking, energy) {
            if (speaking) {
                vadLed.className = 'vad-led speaking';
                vadStatusSpan.textContent = '🔴 SPEAKING';
            } else if (energy > vadThreshold * 0.5) {
                vadLed.className = 'vad-led listening';
                vadStatusSpan.textContent = '🟡 LISTENING';
            } else {
                vadLed.className = 'vad-led idle';
                vadStatusSpan.textContent = '⚪ IDLE';
            }
            
            const percent = Math.min(100, energy * 100);
            energyFill.style.width = `${percent}%`;
            volumeSpan.textContent = `${Math.round(percent)}%`;
        }

        async function sendToGateway(text) {
            addLog(`📤 Sending to Gateway: "${text}"`);
            
            // Update transcript
            transcriptDiv.innerHTML = `<span style="color:#22c55e">🎤 You said: "${text}"</span>`;
            
            try {
                // Get JWT from localStorage if available
                const jwt = localStorage.getItem('surf_jwt');
                const response = await fetch('https://surf-router.aitdevlabs.workers.dev/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(jwt && { 'Authorization': `Bearer ${jwt}` }),
                        'X-Sandbox-Origin': 'https://sb-sf.vercel.app'
                    },
                    body: JSON.stringify({ text: text, voice: 'en-US-AriaNeural' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addLog(`✅ Response: ${data.response.substring(0, 100)}...`);
                    transcriptDiv.innerHTML += `<div style="color:#3b82f6; margin-top:8px">🤖 ${data.response}</div>`;
                } else {
                    addLog(`❌ Gateway error: ${response.status}`);
                }
            } catch (err) {
                addLog(`❌ Network error: ${err.message}`);
            }
        }

        function processAudio(inputData) {
            // Calculate energy (volume)
            let energy = 0;
            for (let i = 0; i < inputData.length; i++) {
                energy += Math.abs(inputData[i]);
            }
            energy = energy / inputData.length;
            currentVolume = energy;
            
            frameCount++;
            if (startTime) {
                const duration = (Date.now() - startTime) / 1000;
                durationSpan.textContent = duration.toFixed(1);
            }
            frameCountSpan.textContent = frameCount;
            
            // VAD logic
            const isSpeechDetected = energy > vadThreshold;
            
            if (isSpeechDetected && !isSpeaking) {
                // Speech started
                isSpeaking = true;
                silenceFrames = 0;
                addLog(`🎤 SPEECH STARTED (energy: ${energy.toFixed(3)})`);
                updateVADUI(true, energy);
            } else if (!isSpeechDetected && isSpeaking) {
                // Possible speech end - wait for silence
                silenceFrames++;
                if (silenceFrames > 10) { // ~200ms of silence
                    isSpeaking = false;
                    addLog(`🔇 SPEECH ENDED (${silenceFrames} silent frames)`);
                    updateVADUI(false, energy);
                    
                    // Here you would send the accumulated audio to Gateway
                    // For testing, we'll just log
                    addLog(`📝 Speech detected! Energy: ${energy.toFixed(3)}`);
                }
            } else {
                updateVADUI(isSpeaking, energy);
            }
            
            // Update UI
            if (!isSpeaking) {
                const percent = Math.min(100, energy * 100);
                energyFill.style.width = `${percent}%`;
                volumeSpan.textContent = `${Math.round(percent)}%`;
            }
        }

        async function startVAD() {
            if (isRunning) {
                addLog('⚠️ VAD already running');
                return;
            }
            
            addLog('🎤 Requesting microphone access...');
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                addLog('✅ Microphone access granted');
                
                audioContext = new AudioContext({ sampleRate: 16000 });
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                processorNode = audioContext.createScriptProcessor(4096, 1, 1);
                
                processorNode.onaudioprocess = (event) => {
                    if (!isRunning) return;
                    const inputData = event.inputBuffer.getChannelData(0);
                    processAudio(inputData);
                };
                
                sourceNode.connect(processorNode);
                processorNode.connect(audioContext.destination);
                
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                
                isRunning = true;
                startTime = Date.now();
                frameCount = 0;
                isSpeaking = false;
                silenceFrames = 0;
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                addLog('✅ VAD started - speak into your microphone');
                vadStatusSpan.textContent = '🟢 LISTENING';
                
            } catch (err) {
                addLog(`❌ Error: ${err.message}`);
                console.error(err);
            }
        }

        function stopVAD() {
            if (!isRunning) return;
            
            if (processorNode) {
                processorNode.disconnect();
                processorNode = null;
            }
            if (sourceNode) {
                sourceNode.disconnect();
                sourceNode = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            
            isRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            
            addLog('⏹️ VAD stopped');
            vadStatusSpan.textContent = '⚪ IDLE';
            vadLed.className = 'vad-led idle';
        }

        function clearLog() {
            logDiv.innerHTML = '';
            addLog('Log cleared');
        }

        startBtn.addEventListener('click', startVAD);
        stopBtn.addEventListener('click', stopVAD);
        clearBtn.addEventListener('click', clearLog);
        
        addLog('VAD Test Page Ready');
        addLog('Click "Start VAD" and allow microphone access');
        addLog('Speak to see voice activity detection');
        addLog('The green LED lights up when speech is detected');
    </script>
</body>
</html>
