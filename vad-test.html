<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD Test - Voice Activity Detection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Monaco', monospace;
            background: #0a0f0f;
            color: #00ff9d;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 { margin-bottom: 20px; }
        .card {
            background: #0d1117;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .auth-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            padding: 10px;
            border-radius: 8px;
            background: #0a0f0f;
            border: 1px solid #2a3a4a;
            color: #00ff9d;
            font-family: inherit;
            flex: 1;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #1e293b; color: #94a3b8; }
        .vad-indicator { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .vad-led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: all 0.1s;
        }
        .vad-led.idle { background: #64748b; }
        .vad-led.listening { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .vad-led.speaking { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 0.3s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
        .energy-bar { width: 100%; height: 30px; background: #1a2332; border-radius: 15px; overflow: hidden; margin: 10px 0; }
        .energy-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #22c55e, #3b82f6); transition: width 0.05s; }
        .stats { display: flex; gap: 20px; margin-top: 15px; font-size: 12px; color: #64748b; }
        .transcript-box {
            background: #0a0f0f;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            font-size: 14px;
            margin-top: 15px;
        }
        .log {
            background: #0d1117;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 10px;
            height: 200px;
            overflow-y: auto;
            font-size: 11px;
            margin-top: 15px;
        }
        .log-entry { margin: 3px 0; }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
        }
        .status-connected { background: #22c55e; color: #0a0f0f; }
        .status-disconnected { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 VAD Test - Voice Activity Detection</h1>
        
        <!-- Auth Card -->
        <div class="card">
            <div class="auth-row">
                <input type="email" id="email" placeholder="Email" value="surf@testuser.com">
                <input type="password" id="password" placeholder="Password" value="Test1234!">
                <button class="btn-primary" id="login-btn">🔐 Login</button>
                <span id="auth-status" class="status-badge status-disconnected">Disconnected</span>
            </div>
        </div>

        <!-- VAD Card -->
        <div class="card" id="vad-card" style="display: none;">
            <div class="vad-indicator">
                <div class="vad-led idle" id="vad-led"></div>
                <span class="vad-status-text" id="vad-status">Ready</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energy-fill"></div>
            </div>
            <div class="stats">
                <span>🔊 Volume: <span id="volume-value">0%</span></span>
                <span>🎤 Frames: <span id="frame-count">0</span></span>
                <span>⏱️ Duration: <span id="duration">0s</span></span>
            </div>
            <div class="transcript-box" id="transcript">
                <span style="color:#64748b">🎤 Speak to see transcription...</span>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-primary" id="start-vad">🎤 Start VAD</button>
                <button class="btn-danger" id="stop-vad">⏹️ Stop</button>
                <button class="btn-secondary" id="clear-log">🗑️ Clear</button>
            </div>
            <div class="stats" style="margin-top: 10px;">
                <span>🎙️ Threshold: <input type="range" id="threshold" min="0" max="100" value="30"></span>
                <span id="threshold-value">0.30</span>
            </div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        // DOM elements
        const loginBtn = document.getElementById('login-btn');
        const authStatus = document.getElementById('auth-status');
        const vadCard = document.getElementById('vad-card');
        const vadLed = document.getElementById('vad-led');
        const vadStatusSpan = document.getElementById('vad-status');
        const energyFill = document.getElementById('energy-fill');
        const volumeSpan = document.getElementById('volume-value');
        const frameCountSpan = document.getElementById('frame-count');
        const durationSpan = document.getElementById('duration');
        const transcriptDiv = document.getElementById('transcript');
        const logDiv = document.getElementById('log');
        const startBtn = document.getElementById('start-vad');
        const stopBtn = document.getElementById('stop-vad');
        const clearBtn = document.getElementById('clear-log');
        const thresholdSlider = document.getElementById('threshold');
        const thresholdSpan = document.getElementById('threshold-value');

        let jwt = null;
        let mediaStream = null;
        let audioContext = null;
        let sourceNode = null;
        let processorNode = null;
        let isRunning = false;
        let frameCount = 0;
        let startTime = null;
        let isSpeaking = false;
        let silenceFrames = 0;
        let vadThreshold = 0.3;
        let audioBuffer = [];

        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';

        function addLog(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span style="color:#64748b">[${time}]</span> ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            addLog(`🔐 Logging in as ${email}...`);
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    jwt = data.access_token;
                    localStorage.setItem('surf_jwt', jwt);
                    authStatus.className = 'status-badge status-connected';
                    authStatus.textContent = 'Connected';
                    vadCard.style.display = 'block';
                    addLog('✅ Login successful! JWT obtained');
                } else {
                    addLog(`❌ Login failed: ${response.status}`);
                }
            } catch (err) {
                addLog(`❌ Login error: ${err.message}`);
            }
        }

        async function sendToGateway(text) {
            if (!jwt) {
                addLog('❌ Not authenticated. Please login first.');
                return;
            }
            
            addLog(`📤 Sending to Gateway: "${text}"`);
            transcriptDiv.innerHTML = `<span style="color:#22c55e">🎤 You said: "${text}"</span>`;
            
            try {
                const response = await fetch('https://surf-router.aitdevlabs.workers.dev/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${jwt}`,
                        'X-Sandbox-Origin': 'https://sb-sf.vercel.app'
                    },
                    body: JSON.stringify({ text: text, voice: 'en-US-AriaNeural' })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addLog(`✅ Response: ${data.response.substring(0, 100)}...`);
                    transcriptDiv.innerHTML += `<div style="color:#3b82f6; margin-top:8px">🤖 ${data.response}</div>`;
                } else {
                    addLog(`❌ Gateway error: ${response.status}`);
                }
            } catch (err) {
                addLog(`❌ Network error: ${err.message}`);
            }
        }

        function processAudio(inputData) {
            let energy = 0;
            for (let i = 0; i < inputData.length; i++) {
                energy += Math.abs(inputData[i]);
            }
            energy = energy / inputData.length;
            
            frameCount++;
            if (startTime) {
                durationSpan.textContent = ((Date.now() - startTime) / 1000).toFixed(1);
            }
            frameCountSpan.textContent = frameCount;
            
            const isSpeechDetected = energy > vadThreshold;
            
            if (isSpeechDetected && !isSpeaking) {
                isSpeaking = true;
                silenceFrames = 0;
                audioBuffer = [];
                addLog(`🎤 SPEECH STARTED`);
                vadLed.className = 'vad-led speaking';
                vadStatusSpan.textContent = '🔴 SPEAKING';
            } else if (!isSpeechDetected && isSpeaking) {
                silenceFrames++;
                if (silenceFrames > 15) {
                    isSpeaking = false;
                    addLog(`🔇 SPEECH ENDED`);
                    vadLed.className = 'vad-led idle';
                    vadStatusSpan.textContent = '⚪ IDLE';
                    
                    // Send accumulated text (simulated - real VAD would send audio)
                    const simulatedText = "Test speech detected";
                    sendToGateway(simulatedText);
                }
            }
            
            const percent = Math.min(100, energy * 100);
            energyFill.style.width = `${percent}%`;
            volumeSpan.textContent = `${Math.round(percent)}%`;
            
            if (isSpeaking) {
                vadLed.className = 'vad-led speaking';
                vadStatusSpan.textContent = '🔴 SPEAKING';
            } else if (energy > vadThreshold * 0.5) {
                vadLed.className = 'vad-led listening';
                vadStatusSpan.textContent = '🟡 LISTENING';
            }
        }

        async function startVAD() {
            if (isRunning) return;
            if (!jwt) {
                addLog('❌ Please login first');
                return;
            }
            
            addLog('🎤 Requesting microphone access...');
            
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });
                
                addLog('✅ Microphone access granted');
                
                audioContext = new AudioContext({ sampleRate: 16000 });
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                processorNode = audioContext.createScriptProcessor(4096, 1, 1);
                
                processorNode.onaudioprocess = (event) => {
                    if (!isRunning) return;
                    processAudio(event.inputBuffer.getChannelData(0));
                };
                
                sourceNode.connect(processorNode);
                processorNode.connect(audioContext.destination);
                
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }
                
                isRunning = true;
                startTime = Date.now();
                frameCount = 0;
                isSpeaking = false;
                silenceFrames = 0;
                audioBuffer = [];
                
                startBtn.disabled = true;
                stopBtn.disabled = false;
                addLog('✅ VAD started - speak into your microphone');
                
            } catch (err) {
                addLog(`❌ Error: ${err.message}`);
            }
        }

        function stopVAD() {
            if (!isRunning) return;
            
            if (processorNode) processorNode.disconnect();
            if (sourceNode) sourceNode.disconnect();
            if (audioContext) audioContext.close();
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            
            isRunning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            addLog('⏹️ VAD stopped');
            vadLed.className = 'vad-led idle';
            vadStatusSpan.textContent = '⚪ IDLE';
        }

        thresholdSlider.addEventListener('input', (e) => {
            vadThreshold = e.target.value / 100;
            thresholdSpan.textContent = vadThreshold.toFixed(2);
        });

        loginBtn.addEventListener('click', login);
        startBtn.addEventListener('click', startVAD);
        stopBtn.addEventListener('click', stopVAD);
        clearBtn.addEventListener('click', () => { logDiv.innerHTML = ''; addLog('Log cleared'); });
        
        addLog('VAD Test Page Ready');
        addLog('Please login first using test credentials');
    </script>
</body>
</html>
