<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAD Test - MediaRecorder Streaming</title>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'SF Mono', 'Monaco', monospace;
            background: #0a0f0f;
            color: #00ff9d;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { margin-bottom: 20px; }
        .card {
            background: #0d1117;
            border: 1px solid #2a3a4a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .auth-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input {
            padding: 10px;
            border-radius: 8px;
            background: #0a0f0f;
            border: 1px solid #2a3a4a;
            color: #00ff9d;
            font-family: inherit;
            flex: 1;
        }
        button {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            border: none;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #1e293b; color: #94a3b8; }
        .vad-indicator { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .vad-led {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            transition: all 0.1s;
        }
        .vad-led.idle { background: #64748b; }
        .vad-led.speaking { background: #22c55e; box-shadow: 0 0 10px #22c55e; animation: pulse 0.3s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .energy-bar { width: 100%; height: 30px; background: #1a2332; border-radius: 15px; overflow: hidden; margin: 10px 0; }
        .energy-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #22c55e, #3b82f6); transition: width 0.05s; }
        .stats { display: flex; gap: 20px; margin-top: 15px; font-size: 12px; color: #64748b; flex-wrap: wrap; }
        .transcript-box {
            background: #0a0f0f;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 15px;
            min-height: 120px;
            font-size: 14px;
            margin-top: 15px;
        }
        .log {
            background: #0d1117;
            border: 1px solid #2a3a4a;
            border-radius: 8px;
            padding: 10px;
            height: 250px;
            overflow-y: auto;
            font-size: 11px;
            margin-top: 15px;
        }
        .log-entry { margin: 3px 0; border-left: 2px solid #3b82f6; padding-left: 8px; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }
        .status-connected { background: #22c55e; color: #0a0f0f; }
        .status-disconnected { background: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 VAD Test - MediaRecorder Streaming</h1>
        
        <div class="card">
            <div class="auth-row">
                <input type="email" id="email" placeholder="Email" value="surf@testuser.com">
                <input type="password" id="password" placeholder="Password" value="Test1234!">
                <button class="btn-primary" id="login-btn">🔐 Login & Connect</button>
                <span id="auth-status" class="status-badge status-disconnected">Disconnected</span>
            </div>
        </div>

        <div class="card" id="vad-card" style="display: none;">
            <div class="vad-indicator">
                <div class="vad-led idle" id="vad-led"></div>
                <span class="vad-status-text" id="vad-status">Ready</span>
            </div>
            <div class="energy-bar">
                <div class="energy-fill" id="energy-fill"></div>
            </div>
            <div class="stats">
                <span>🔊 Volume: <span id="volume-value">0%</span></span>
                <span>📤 Chunks Sent: <span id="chunk-count">0</span></span>
                <span>📡 Socket: <span id="socket-status">Disconnected</span></span>
            </div>
            <div class="transcript-box" id="transcript">
                <span style="color:#64748b">🎤 Speak to see transcription...</span>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-primary" id="start-vad">🎤 Start Voice</button>
                <button class="btn-danger" id="stop-vad">⏹️ Stop Voice</button>
                <button class="btn-secondary" id="clear-log">🗑️ Clear</button>
            </div>
        </div>

        <div class="log" id="log"></div>
    </div>

    <script>
        const GATEWAY_URL = 'https://surf-router.aitdevlabs.workers.dev';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';

        let jwt = null, socket = null, mediaStream = null, mediaRecorder = null;
        let isActive = false, chunkCount = 0;
        let audioContext = null, analyser = null, animationId = null;

        function addLog(msg) {
            const time = new Date().toLocaleTimeString();
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span style="color:#64748b">[${time}]</span> ${msg}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function loginAndConnect() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            addLog(`🔐 Logging in...`);
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'apikey': SUPABASE_ANON, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (!response.ok) throw new Error(`Login failed`);
                const data = await response.json();
                jwt = data.access_token;
                addLog(`✅ Login successful`);
                
                addLog(`🔌 Connecting WebSocket...`);
                document.getElementById('auth-status').className = 'status-badge status-connecting';
                document.getElementById('auth-status').textContent = 'Connecting...';
                
                socket = io(GATEWAY_URL, {
                    transports: ['websocket'],
                    extraHeaders: { 'X-Sandbox-Origin': 'https://sb-sf.vercel.app' }
                });
                
                socket.on('connect', () => {
                    addLog(`✅ WebSocket connected`);
                    document.getElementById('socket-status').textContent = 'Connected';
                    socket.emit('authenticate', { token: jwt });
                });
                
                socket.on('authenticated', (data) => {
                    addLog(`✅ Authenticated!`);
                    document.getElementById('auth-status').className = 'status-badge status-connected';
                    document.getElementById('auth-status').textContent = 'Connected';
                    document.getElementById('vad-card').style.display = 'block';
                });
                
                socket.on('session_ready', () => addLog(`✅ Voice session ready`));
                
                socket.on('transcript', (data) => {
                    const prefix = data.is_final ? '🎤' : '📝';
                    document.getElementById('transcript').innerHTML = `<span style="color:#22c55e">${prefix} "${data.text}"</span>`;
                    if (data.is_final) addLog(`📝 Transcript: "${data.text}"`);
                });
                
                socket.on('response', (data) => {
                    addLog(`🤖 AI: ${data.text.substring(0, 100)}`);
                    const div = document.getElementById('transcript');
                    div.innerHTML += `<div style="color:#3b82f6; margin-top:8px">🤖 ${data.text}</div>`;
                });
                
                socket.on('error', (data) => addLog(`❌ Error: ${JSON.stringify(data)}`));
                socket.on('disconnect', () => addLog(`🔌 Disconnected`));
                
            } catch (err) {
                addLog(`❌ ${err.message}`);
            }
        }

        async function startVoice() {
            if (!socket?.connected) { addLog(`❌ WebSocket not connected`); return; }
            
            addLog(`🎤 Requesting microphone...`);
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                addLog(`✅ Microphone granted`);
                
                // Setup audio analysis for VU meter
                audioContext = new AudioContext();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(mediaStream);
                source.connect(analyser);
                
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                function updateVolume() {
                    if (!isActive) return;
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    const avg = sum / dataArray.length;
                    const percent = Math.min(100, (avg / 255) * 100);
                    document.getElementById('energy-fill').style.width = `${percent}%`;
                    document.getElementById('volume-value').textContent = `${Math.round(percent)}%`;
                    
                    const isSpeaking = percent > 15;
                    const led = document.getElementById('vad-led');
                    const status = document.getElementById('vad-status');
                    if (isSpeaking) {
                        led.className = 'vad-led speaking';
                        status.textContent = '🔴 SPEAKING';
                    } else {
                        led.className = 'vad-led idle';
                        status.textContent = '⚪ IDLE';
                    }
                    animationId = requestAnimationFrame(updateVolume);
                }
                
                // Use MediaRecorder for audio capture
                mediaRecorder = new MediaRecorder(mediaStream, {
                    mimeType: MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4'
                });
                
                mediaRecorder.ondataavailable = async (event) => {
                    if (event.data.size > 0 && socket?.connected && isActive) {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            socket.emit('audio_data', { audio: base64, format: 'webm' });
                            chunkCount++;
                            document.getElementById('chunk-count').textContent = chunkCount;
                            if (chunkCount % 5 === 0) addLog(`📤 Sent ${chunkCount} chunks`);
                        };
                        reader.readAsDataURL(event.data);
                    }
                };
                
                mediaRecorder.start(1000); // Send every 1 second
                isActive = true;
                chunkCount = 0;
                
                if (audioContext.state === 'suspended') await audioContext.resume();
                updateVolume();
                
                socket.emit('start_voice', { voice: 'en-US-AriaNeural' });
                document.getElementById('start-vad').disabled = true;
                document.getElementById('stop-vad').disabled = false;
                addLog(`✅ Voice active - speak now!`);
                
            } catch (err) {
                addLog(`❌ Mic error: ${err.message}`);
            }
        }

        function stopVoice() {
            isActive = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (audioContext) audioContext.close();
            if (animationId) cancelAnimationFrame(animationId);
            if (socket?.connected) socket.emit('stop_voice');
            
            document.getElementById('start-vad').disabled = false;
            document.getElementById('stop-vad').disabled = true;
            document.getElementById('vad-led').className = 'vad-led idle';
            document.getElementById('vad-status').textContent = 'Stopped';
            addLog(`⏹️ Voice stopped`);
        }

        document.getElementById('login-btn').onclick = loginAndConnect;
        document.getElementById('start-vad').onclick = startVoice;
        document.getElementById('stop-vad').onclick = stopVoice;
        document.getElementById('clear-log').onclick = () => { document.getElementById('log').innerHTML = ''; addLog('Log cleared'); };
        
        addLog('VAD Test Ready - Click Login & Connect');
    </script>
</body>
</html>
