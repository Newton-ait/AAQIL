<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; margin-top: 20px; }
        h1 { font-size: 18px; margin-bottom: 12px; }
        .gradient { background: linear-gradient(135deg, #3B82F6, #60A5FA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #1E293B; border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid #334155; }
        .status { font-size: 11px; color: #94A3B8; margin-bottom: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot.green { background: #22C55E; }
        .dot.yellow { background: #F59E0B; animation: pulse 1s infinite; }
        .dot.red { background: #EF4444; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .chat-box { background: #1E293B; border-radius: 14px; padding: 12px; height: 300px; overflow-y: auto; margin-bottom: 8px; font-size: 13px; }
        .msg { margin-bottom: 6px; padding: 6px 10px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: #3B82F6; margin-left: auto; border-bottom-right-radius: 3px; }
        .msg.ai { background: #334155; margin-right: auto; border-bottom-left-radius: 3px; }
        .msg.system { text-align: center; font-size: 10px; color: #64748B; width: 100%; max-width: 100%; }
        .input-area { display: flex; gap: 6px; }
        input { flex: 1; padding: 10px 14px; border-radius: 24px; border: 1.5px solid #334155; background: #1E293B; color: #E2E8F0; font-size: 14px; outline: none; }
        input:focus { border-color: #3B82F6; }
        button { padding: 10px 18px; border: none; border-radius: 24px; font-weight: 600; font-size: 13px; cursor: pointer; background: #3B82F6; color: white; }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏄 Surf <span class="gradient">AI</span> — Chat</h1>
    <div class="card">
        <div class="status"><span class="dot yellow" id="dot"></span><span id="statusText">Connecting...</span></div>
    </div>
    <div class="chat-box" id="chatBox"><div class="msg system">🔄 Connecting to sandbox...</div></div>
    <div class="input-area">
        <input id="chatInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" disabled>Send</button>
    </div>
</div>

<!-- Try loading sandbox in a visible tiny iframe first to debug -->
<iframe id="sandboxFrame" src="https://sb-sf.vercel.app/" allow="microphone; autoplay" 
        style="position:absolute;top:0;left:0;width:1px;height:1px;border:none;opacity:0.01;"></iframe>

<script>
    const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
    
    let authToken = null;
    let sandboxReady = false;
    const sandboxFrame = document.getElementById('sandboxFrame');
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    
    // Global message handler
    window.__handleSandboxMessage = function(m) {
        console.log('🌉 Global handler called with:', m);
        processMessage(m);
    };
    
    function updateStatus(state) {
        statusDot.className = 'dot ' + state;
        if (state === 'green') {
            statusText.textContent = 'Sandbox Ready';
        } else if (state === 'red') {
            statusText.textContent = 'Connection Failed';
        } else {
            statusText.textContent = 'Connecting...';
        }
    }
    
    function chatMsg(text, role) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg ' + role;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function processMessage(m) {
        if (!m || !m.type) return;
        
        console.log('✅ Processing message type:', m.type);
        
        switch(m.type) {
            case 'sandbox_ready':
                console.log('🎯 SANDBOX READY!');
                updateStatus('green');
                sandboxReady = true;
                chatMsg('✅ Sandbox ready', 'system');
                login();
                break;
                
            case 'token_received':
                console.log('🎯 Token received from sandbox');
                chatInput.disabled = false;
                sendBtn.disabled = false;
                chatMsg('✅ Authenticated — send a message!', 'system');
                break;
                
            case 'transcript':
                chatMsg('🎤 ' + m.text, 'user');
                break;
                
            case 'response':
            case 'chat_response':
                chatMsg('🤖 ' + m.text, 'ai');
                break;
                
            case 'log':
                console.log('[Sandbox log]', m.message);
                break;
        }
    }
    
    // Set up ALL possible message listeners
    window.addEventListener('message', function(event) {
        console.log('📨 Message Listener 1 (capture):', event.origin, event.data?.type);
        processMessage(event.data);
    }, true);
    
    window.addEventListener('message', function(event) {
        console.log('📨 Message Listener 2 (bubble):', event.origin, event.data?.type);
        processMessage(event.data);
    }, false);
    
    window.onmessage = function(event) {
        console.log('📨 window.onmessage:', event.origin, event.data?.type);
        processMessage(event.data);
    };
    
    document.addEventListener('message', function(event) {
        console.log('📨 document.onmessage:', event.origin, event.data?.type);
        processMessage(event.data);
    });
    
    // Also try to intercept the postMessage call
    const originalPostMessage = window.postMessage;
    window.postMessage = function(message, targetOrigin, transfer) {
        console.log('🔍 Intercepted postMessage from:', new Error().stack);
        console.log('🔍 Message:', message);
        return originalPostMessage.call(this, message, targetOrigin, transfer);
    };
    
    function sendToSandbox(msg) {
        if (sandboxFrame.contentWindow) {
            console.log('📤 Sending to sandbox:', msg);
            try {
                sandboxFrame.contentWindow.postMessage(msg, 'https://sb-sf.vercel.app');
            } catch(e) {
                console.error('Failed to post message:', e);
            }
        }
    }
    
    // Polling mechanism - check if sandbox has set a global variable
    function pollSandbox() {
        try {
            // Try to access sandbox content (will fail if cross-origin)
            const sandboxWindow = sandboxFrame.contentWindow;
            if (sandboxWindow) {
                // Some sandbox pages set window.name or hash
                console.log('🔍 Polling sandbox...');
                
                // Check if sandbox modified its location hash
                if (sandboxFrame.src.includes('#ready')) {
                    console.log('🎯 Sandbox ready detected via hash');
                    updateStatus('green');
                    sandboxReady = true;
                    chatMsg('✅ Sandbox ready (hash)', 'system');
                    login();
                    return;
                }
            }
        } catch(e) {
            console.log('🔍 Cross-origin polling failed (expected):', e.message);
        }
        
        if (!sandboxReady) {
            setTimeout(pollSandbox, 1000);
        }
    }
    setTimeout(pollSandbox, 2000);
    
    async function login() {
        try {
            console.log('🔐 Attempting login...');
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
                body: JSON.stringify({ email: 'surf@testuser.com', password: 'Test1234!' })
            });
            const data = await res.json();
            console.log('🔑 Login response:', data);
            
            if (data.access_token) {
                authToken = data.access_token;
                chatMsg('✅ Logged in', 'system');
                chatInput.disabled = false;
                sendBtn.disabled = false;
                
                if (sandboxReady) {
                    sendToSandbox({ type: 'auth_token', token: authToken });
                }
            } else {
                chatMsg('❌ Login failed', 'system');
            }
        } catch(e) {
            console.error('Login error:', e);
            chatMsg('❌ Login error', 'system');
        }
    }
    
    function send() {
        const text = chatInput.value.trim();
        if (!text) return;
        
        chatMsg(text, 'user');
        chatInput.value = '';
        
        if (sandboxReady && authToken) {
            sendToSandbox({ type: 'extension_command', action: 'sendText', text });
        } else {
            setTimeout(() => {
                chatMsg('🤖 Sandbox not connected - echo: ' + text, 'ai');
            }, 500);
        }
    }
    
    sendBtn.addEventListener('click', send);
    chatInput.addEventListener('keydown', function(e) { 
        if (e.key === 'Enter') send(); 
    });
    
    console.log('🚀 Main script initialized');
    console.log('📍 Current origin:', window.location.origin);
    console.log('🎯 Sandbox URL:', sandboxFrame.src);
    console.log('🔧 Ready to receive messages from sandbox');
</script>
</body>
</html>
