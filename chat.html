<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; margin-top: 20px; }
        h1 { font-size: 18px; margin-bottom: 12px; }
        .gradient { background: linear-gradient(135deg, #3B82F6, #60A5FA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #1E293B; border-radius: 14px; padding: 14px; margin-bottom: 10px; border: 1px solid #334155; }
        .status { font-size: 11px; color: #94A3B8; margin-bottom: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot.green { background: #22C55E; }
        .dot.yellow { background: #F59E0B; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .chat-box { background: #1E293B; border-radius: 14px; padding: 12px; height: 300px; overflow-y: auto; margin-bottom: 8px; font-size: 13px; }
        .msg { margin-bottom: 6px; padding: 6px 10px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: #3B82F6; margin-left: auto; border-bottom-right-radius: 3px; }
        .msg.ai { background: #334155; margin-right: auto; border-bottom-left-radius: 3px; }
        .msg.system { text-align: center; font-size: 10px; color: #64748B; width: 100%; max-width: 100%; }
        .input-area { display: flex; gap: 6px; }
        input { flex: 1; padding: 10px 14px; border-radius: 24px; border: 1.5px solid #334155; background: #1E293B; color: #E2E8F0; font-size: 14px; outline: none; }
        input:focus { border-color: #3B82F6; }
        button { padding: 10px 18px; border: none; border-radius: 24px; font-weight: 600; font-size: 13px; cursor: pointer; background: #3B82F6; color: white; }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏄 Surf <span class="gradient">AI</span> — Chat</h1>
    <div class="card">
        <div class="status"><span class="dot yellow" id="dot"></span><span id="statusText">Connecting...</span></div>
    </div>
    <div class="chat-box" id="chatBox"><div class="msg system">🔄 Connecting to sandbox...</div></div>
    <div class="input-area">
        <input id="chatInput" placeholder="Type a message..." disabled>
        <button id="sendBtn" disabled>Send</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
    
    let authToken = null;
    let sandboxReady = false;
    const chatBox = document.getElementById('chatBox');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    
    // Create a BroadcastChannel for same-origin communication fallback
    // This won't work cross-origin, but let's try it
    let channel;
    try {
        channel = new BroadcastChannel('surf_ai_channel');
        channel.onmessage = function(event) {
            console.log('📡 BroadcastChannel received:', event.data);
            handleSandboxMessage(event.data);
        };
        console.log('📡 BroadcastChannel created');
    } catch(e) {
        console.log('BroadcastChannel not available:', e.message);
    }
    
    function updateStatus(state) {
        statusDot.className = 'dot ' + state;
        statusText.textContent = state === 'green' ? 'Sandbox Ready' : 'Connecting...';
    }
    
    function chatMsg(text, role) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'msg ' + role;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
    
    function handleSandboxMessage(m) {
        if (!m || !m.type) return;
        console.log('🎯 Processing sandbox message:', m.type);
        
        if (m.type === 'sandbox_ready') {
            console.log('🎯 SANDBOX READY!');
            updateStatus('green');
            sandboxReady = true;
            chatMsg('✅ Sandbox ready', 'system');
            login();
        } else if (m.type === 'token_received') {
            chatInput.disabled = false;
            sendBtn.disabled = false;
            chatMsg('✅ Ready', 'system');
        } else if (m.type === 'transcript') {
            chatMsg('🎤 ' + m.text, 'user');
        } else if (m.type === 'response' || m.type === 'chat_response') {
            chatMsg('🤖 ' + m.text, 'ai');
        }
    }
    
    // ALL possible message listeners
    window.addEventListener('message', function(event) {
        console.log('📨 window message:', event.origin, event.data?.type);
        handleSandboxMessage(event.data);
    });
    
    // Service Worker message channel
    if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', function(event) {
            console.log('📨 SW message:', event.data);
            handleSandboxMessage(event.data);
        });
    }
    
    function sendToSandbox(msg) {
        const iframe = document.getElementById('sandboxFrame');
        if (iframe && iframe.contentWindow) {
            console.log('📤 postMessage to sandbox:', msg);
            iframe.contentWindow.postMessage(msg, '*');
        }
        
        // Also try BroadcastChannel
        if (channel) {
            channel.postMessage(msg);
        }
    }
    
    // Watch for sandbox setting a global ready flag
    function checkReadyViaDOM() {
        const iframe = document.getElementById('sandboxFrame');
        if (!iframe) return false;
        
        try {
            // Try to access sandbox's localStorage (won't work cross-origin normally)
            // But we can check iframe attributes
            const src = iframe.src;
            if (src.includes('#ready')) {
                return true;
            }
        } catch(e) {}
        
        return false;
    }
    
    // Poll for sandbox readiness
    let pollCount = 0;
    function pollForReady() {
        pollCount++;
        
        if (sandboxReady) return;
        
        // Check various indicators
        if (checkReadyViaDOM()) {
            console.log('🎯 Sandbox ready detected via DOM');
            updateStatus('green');
            sandboxReady = true;
            chatMsg('✅ Sandbox ready (detected)', 'system');
            login();
            return;
        }
        
        // Also send a ping message
        if (pollCount % 2 === 0) {
            sendToSandbox({ type: 'ping', from: 'parent' });
        }
        
        if (pollCount < 20) {  // Poll for 20 seconds max
            setTimeout(pollForReady, 1000);
        } else {
            console.log('⏰ Polling timeout');
            chatMsg('⚠️ Sandbox not detected, using direct mode', 'system');
            login();
        }
    }
    
    // Create iframe
    const iframe = document.createElement('iframe');
    iframe.id = 'sandboxFrame';
    iframe.src = 'https://sb-sf.vercel.app/#parent-ready';  // Add hash to check
    iframe.allow = 'microphone; autoplay';
    iframe.style.display = 'none';
    
    iframe.addEventListener('load', function() {
        console.log('✅ Sandbox iframe loaded');
        setTimeout(pollForReady, 500);
    });
    
    document.body.appendChild(iframe);
    
    console.log('🚀 Setup complete, iframe loading...');
    
    async function login() {
        try {
            console.log('🔐 Logging in...');
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
                body: JSON.stringify({ email: 'surf@testuser.com', password: 'Test1234!' })
            });
            const data = await res.json();
            
            if (data.access_token) {
                authToken = data.access_token;
                chatMsg('✅ Logged in', 'system');
                chatInput.disabled = false;
                sendBtn.disabled = false;
                
                if (sandboxReady) {
                    console.log('📤 Sending auth token to sandbox');
                    sendToSandbox({ type: 'auth_token', token: authToken });
                } else {
                    chatMsg('⚠️ Running in standalone mode', 'system');
                }
            } else {
                chatMsg('❌ Login failed', 'system');
            }
        } catch(e) {
            console.error('Login error:', e);
            chatMsg('❌ Login error', 'system');
        }
    }
    
    function sendChat() {
        const text = chatInput.value.trim();
        if (!text) return;
        
        chatMsg(text, 'user');
        chatInput.value = '';
        
        if (sandboxReady && authToken) {
            sendToSandbox({ type: 'extension_command', action: 'sendText', text });
            chatMsg('📤 Sent to sandbox', 'system');
        } else {
            setTimeout(() => {
                chatMsg('🤖 [Standalone] Echo: ' + text, 'ai');
            }, 500);
        }
    }
    
    sendBtn.addEventListener('click', sendChat);
    chatInput.addEventListener('keydown', e => { 
        if (e.key === 'Enter') sendChat(); 
    });
</script>
</body>
</html>
