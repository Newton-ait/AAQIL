<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surf Voice - Sandbox Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ff9d; margin-bottom: 10px; }
        #status-bar {
            display: flex; gap: 12px; align-items: center; margin-bottom: 15px;
            background: #16213e; padding: 10px 20px; border-radius: 30px;
        }
        #status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #ff4444;
            transition: all 0.3s;
        }
        #status-dot.connected { background: #00ff9d; box-shadow: 0 0 10px #00ff9d; }
        #status-dot.sfu { background: #00aaff; box-shadow: 0 0 10px #00aaff; }
        #status-text { font-size: 13px; }
        #mode-badge {
            font-size: 10px; padding: 2px 10px; border-radius: 12px;
            background: #1a2332; color: #888;
        }
        #mode-badge.active { background: #00ff9d22; color: #00ff9d; }

        #chat-box {
            width: 100%; max-width: 500px; height: 260px;
            overflow-y: auto; background: #16213e; border-radius: 12px;
            padding: 15px; margin-bottom: 15px; border: 1px solid #333;
        }
        .msg { margin-bottom: 6px; padding: 5px 10px; border-radius: 8px; max-width: 85%; font-size: 13px; }
        .msg.user { background: #00ff9d22; border: 1px solid #00ff9d44; margin-left: auto; }
        .msg.ai { background: #333; margin-right: auto; }
        .msg.system { text-align: center; font-size: 10px; color: #666; }
        .msg .time { font-size: 9px; color: #555; display: block; }

        #input-area {
            display: flex; width: 100%; max-width: 500px; gap: 8px; margin-bottom: 10px;
        }
        #text-input {
            flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #444;
            background: #16213e; color: #fff; font-size: 14px;
        }
        button {
            padding: 10px 18px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 14px;
        }
        #mic-start { background: #00ff9d; color: #000; }
        #mic-stop { background: #ff4444; color: #fff; }
        #text-send { background: #333; color: #fff; }

        #sandbox-frame {
            width: 100%; max-width: 500px; height: 60px;
            border: 1px solid #333; border-radius: 8px;
            background: #0d1117;
        }

        #debug-panel {
            width: 100%; max-width: 500px; background: #0d1117;
            border: 1px solid #333; border-radius: 8px; padding: 10px;
            font-family: monospace; font-size: 10px; max-height: 120px;
            overflow-y: auto; margin-top: 10px;
        }
        #debug-panel div { padding: 1px 0; border-bottom: 1px solid #0a0a0a; }
        .log-sent { color: #ffaa00; } .log-recv { color: #00aaff; } .log-err { color: #ff4444; }
        .log-info { color: #8a9aaa; }
    </style>
</head>
<body>
    <h1>🏄 Surf Voice</h1>

    <div id="status-bar">
        <div id="status-dot"></div>
        <span id="status-text">Loading sandbox...</span>
        <span id="mode-badge">--</span>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <button id="mic-start">🎤 Start Mic</button>
        <button id="mic-stop" style="display:none">⏹️ Stop</button>
        <input id="text-input" placeholder="Type a message..." />
        <button id="text-send">Send</button>
    </div>

    <!-- Hidden sandbox iframe -->
    <iframe id="sandbox-frame" src="https://ashirafnewton-ait.github.io/extension/" allow="microphone; autoplay"></iframe>

    <div id="debug-panel"></div>

    <script>
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        const SANDBOX_URL = 'https://ashirafnewton-ait.github.io/extension/';

        let authToken = null;
        let sandboxReady = false;
        let micActive = false;

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const modeBadge = document.getElementById('mode-badge');
        const chatBox = document.getElementById('chat-box');
        const textInput = document.getElementById('text-input');
        const micStartBtn = document.getElementById('mic-start');
        const micStopBtn = document.getElementById('mic-stop');
        const textSendBtn = document.getElementById('text-send');
        const sandboxFrame = document.getElementById('sandbox-frame');
        const debugPanel = document.getElementById('debug-panel');

        function debug(msg, cls = 'log-info') {
            const ts = new Date().toLocaleTimeString();
            debugPanel.innerHTML += `<div class="${cls}">[${ts}] ${msg}</div>`;
            debugPanel.scrollTop = debugPanel.scrollHeight;
            console.log(msg);
        }

        function log(text, type = 'system') {
            const time = new Date().toLocaleTimeString();
            chatBox.innerHTML += `<div class="msg ${type}"><span class="time">${time}</span>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ════════════ POST MESSAGE TO SANDBOX ════════════
        function postToSandbox(data) {
            debug(`→ sandbox: ${data.type}`, 'log-sent');
            sandboxFrame.contentWindow.postMessage(data, '*');
        }

        // ════════════ AUTH ════════════
        async function login() {
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
                    body: JSON.stringify({ email: 'surf@testuser.com', password: 'Test1234!' })
                });
                const data = await res.json();
                if (data.access_token) {
                    authToken = data.access_token;
                    debug('✅ Auth ready', 'log-info');
                    // Send token to sandbox
                    if (sandboxReady) {
                        postToSandbox({ type: 'auth_token', token: authToken });
                    }
                }
            } catch (e) {
                debug(`Auth error: ${e.message}`, 'log-err');
            }
        }

        // ════════════ TEXT CHAT ════════════
        async function sendText(text) {
            if (!authToken || !text.trim()) return;
            log(text, 'user');
            textInput.value = '';
            try {
                const res = await fetch(`${GATEWAY}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ text, voice: 'en-US-AriaNeural' })
                });
                const data = await res.json();
                if (data.response) log('🤖 ' + data.response, 'ai');
                if (data.audio_base64) playAudio(data.audio_base64);
            } catch (e) {
                debug(`Chat error: ${e.message}`, 'log-err');
            }
        }

        function playAudio(encoded) {
            if (!encoded) return;
            const isBase64 = /[+/=A-Z]/.test(encoded.substring(0, 4)) || encoded.includes('=');
            let bytes;
            if (isBase64) {
                const b = atob(encoded); bytes = new Uint8Array(b.length);
                for (let i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
            } else {
                bytes = new Uint8Array(encoded.match(/.{1,2}/g).map(b => parseInt(b, 16)));
            }
            const blob = new Blob([bytes], { type: 'audio/mpeg' });
            const audio = new Audio(URL.createObjectURL(blob));
            audio.play();
        }

        // ════════════ MIC CONTROL ════════════
        function startMic() {
            if (!sandboxReady || !authToken) return debug('Sandbox not ready', 'log-err');
            postToSandbox({ type: 'start_mic' });
            micActive = true;
            micStartBtn.style.display = 'none';
            micStopBtn.style.display = 'inline-block';
            debug('🎤 Start command sent to sandbox', 'log-sent');
        }

        function stopMic() {
            postToSandbox({ type: 'stop_mic' });
            micActive = false;
            micStartBtn.style.display = 'inline-block';
            micStopBtn.style.display = 'none';
            debug('⏹️ Stop command sent to sandbox', 'log-sent');
        }

        // ════════════ LISTEN FOR SANDBOX MESSAGES ════════════
        window.addEventListener('message', (event) => {
            // Accept messages from sandbox origin
            if (!event.origin.includes('ashirafnewton-ait.github.io')) return;

            const msg = event.data;
            debug(`← sandbox: ${msg.type}`, 'log-recv');

            switch (msg.type) {
                case 'sandbox_ready':
                    sandboxReady = true;
                    statusDot.className = 'connected';
                    statusText.textContent = 'Sandbox Ready';
                    modeBadge.textContent = 'SANDBOX';
                    modeBadge.classList.add('active');
                    debug('✅ Sandbox ready', 'log-info');
                    log('✅ Sandbox loaded & ready');
                    // Send auth if we have it
                    if (authToken) {
                        postToSandbox({ type: 'auth_token', token: authToken });
                    }
                    break;

                case 'status':
                    statusText.textContent = msg.text;
                    break;

                case 'streaming':
                    statusDot.className = msg.mode === 'sfu' ? 'sfu' : 'connected';
                    modeBadge.textContent = (msg.mode || 'REST').toUpperCase();
                    break;

                case 'transcript':
                    log('📝 ' + msg.text, 'user');
                    break;

                case 'response':
                    log('🤖 ' + msg.text, 'ai');
                    break;

                case 'tts_playing':
                    statusText.textContent = '🔊 Speaking...';
                    break;

                case 'disconnected':
                    statusDot.className = '';
                    modeBadge.textContent = '--';
                    modeBadge.classList.remove('active');
                    statusText.textContent = 'Disconnected';
                    micActive = false;
                    micStartBtn.style.display = 'inline-block';
                    micStopBtn.style.display = 'none';
                    break;

                case 'error':
                    debug(`Sandbox error: ${msg.message}`, 'log-err');
                    log('⚠️ ' + msg.message, 'system');
                    break;

                case 'log':
                    // Sandbox debug logs
                    debug(`[sandbox] ${msg.message}`, 'log-info');
                    break;
            }
        });

        // ════════════ BUTTON EVENTS ════════════
        micStartBtn.onclick = startMic;
        micStopBtn.onclick = stopMic;
        textSendBtn.onclick = () => sendText(textInput.value);
        textInput.onkeydown = (e) => { if (e.key === 'Enter') sendText(textInput.value); };

        // ════════════ INIT ════════════
        debug('Client ready — loading sandbox...', 'log-info');
        login();
    </script>
</body>
</html>
