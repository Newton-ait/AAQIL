<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surf Voice - Silero VAD Direct</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at 10% 20%, #0B1120, #0A0F1A);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .vad-container {
            max-width: 580px;
            width: 100%;
            background: rgba(18, 25, 45, 0.75);
            backdrop-filter: blur(12px);
            border-radius: 3rem;
            padding: 1.5rem;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 157, 0.15);
            border: 1px solid rgba(0, 255, 157, 0.3);
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #C0FFE0, #00ff9d);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .badge {
            background: #00ff9d22;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            color: #00ff9d;
            border: 1px solid #00ff9d55;
        }
        .header { display: flex; justify-content: space-between; margin-bottom: 1rem; align-items: center; }
        #global-status {
            background: #0E1622;
            border-radius: 2rem;
            padding: 10px 18px;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            border-left: 4px solid #00ff9d;
        }
        .status-led { display: flex; align-items: center; gap: 10px; }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4a5568;
            transition: 0.2s;
        }
        .led.active-led { background: #00ff9d; box-shadow: 0 0 10px #00ff9d; animation: pulse 1.2s infinite; }
        .led.speak-led { background: #ffaa44; box-shadow: 0 0 12px #ffaa44; animation: pulse 0.6s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1.2); } }
        .voice-config { display: flex; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
        select, .sensitivity-control {
            background: #111827;
            border: 1px solid #2d3a4e;
            border-radius: 2rem;
            padding: 8px 16px;
            color: white;
        }
        .vad-sphere {
            background: #0A0F1E;
            border-radius: 2rem;
            padding: 1.2rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .mic-icon { font-size: 4rem; transition: transform 0.1s; }
        .vad-status-text {
            font-size: 1.2rem;
            font-weight: 600;
            background: #1F2A3E;
            display: inline-block;
            padding: 5px 18px;
            border-radius: 40px;
        }
        .energy-bar {
            width: 100%;
            height: 8px;
            background: #1E2A3A;
            border-radius: 20px;
            overflow: hidden;
            margin: 12px 0;
        }
        .energy-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ff9d, #2de0b5);
            transition: width 0.05s linear;
        }
        .btn-vad {
            background: #1F2A42;
            border: none;
            padding: 12px 24px;
            border-radius: 3rem;
            font-weight: 700;
            color: #e2e8f0;
            cursor: pointer;
            border: 1px solid #334155;
        }
        .btn-vad.active {
            background: #00ff9d;
            color: #0a0f1a;
            box-shadow: 0 0 14px #00ff9d;
        }
        .btn-vad:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .conversation-box {
            background: #0C1122cc;
            border-radius: 1.5rem;
            padding: 1rem;
            height: 280px;
            overflow-y: auto;
            margin: 1rem 0;
        }
        .message { margin-bottom: 14px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.ai { align-items: flex-start; }
        .user .bubble {
            background: #00ff9d20;
            border: 1px solid #00ff9d60;
            border-radius: 20px 20px 4px 20px;
        }
        .ai .bubble {
            background: #1E293B;
            border: 1px solid #3b4c6b;
            border-radius: 20px 20px 20px 4px;
        }
        .bubble {
            max-width: 85%;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: #eef2ff;
        }
        .timestamp { font-size: 0.65rem; color: #7f8ea3; margin-bottom: 4px; }
        .debug-console {
            background: #03060c;
            border-radius: 1rem;
            margin-top: 1rem;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 0.7rem;
            max-height: 110px;
            overflow-y: auto;
            color: #8da3c0;
        }
        input[type="range"] { width: 130px; }
        .sensitivity-control { display: flex; align-items: center; gap: 12px; }
    </style>
</head>
<body>
<div class="vad-container">
    <div class="header">
        <h1>🎙️ Silero VAD</h1>
        <div class="badge" id="model-badge">loading model...</div>
    </div>
    <div id="global-status">
        <div class="status-led"><div class="led" id="connection-led"></div><span id="status-text">Initializing...</span></div>
        <div class="status-led"><div class="led" id="vad-led"></div><span id="vad-state-label">⚡ VAD off</span></div>
    </div>
    <div class="voice-config">
        <select id="voice-select">
            <option value="en-US-AriaNeural">🇺🇸 Aria</option>
            <option value="en-US-GuyNeural">🇺🇸 Guy</option>
            <option value="en-GB-SoniaNeural">🇬🇧 Sonia</option>
        </select>
        <div class="sensitivity-control">
            <span>⏱️ Silence (s)</span>
            <input type="range" id="silence-slider" min="0.5" max="2.0" step="0.1" value="1.2">
            <span id="silence-value">1.2</span>
        </div>
    </div>
    <div class="vad-sphere">
        <div class="mic-icon" id="mic-animation">🎤</div>
        <div class="vad-status-text" id="vadPhrase">⚡ Loading model...</div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
        <button class="btn-vad" id="vadToggleBtn" disabled>⏳ Loading...</button>
    </div>
    <div class="conversation-box" id="chatBox">
        <div class="message ai"><div class="timestamp">system</div><div class="bubble">Loading Silero VAD model...</div></div>
    </div>
    <div class="debug-console" id="debugConsole">🔍 Starting...</div>
</div>

<script type="importmap">
{
    "imports": {
        "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/esm/ort.min.js"
    }
}
</script>

<script type="module">
    import * as ort from 'onnxruntime-web';

    // ═══════════════════ CONFIG ═══════════════════
    const GATEWAY = 'https://surf-gateway.onrender.com';
    const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
    const MODEL_URL = 'https://ashirafnewton-ait.github.io/extension/lib/silero_vad.onnx';

    // ═══════════════════ STATE ═══════════════════
    let authToken = null;
    let vadSession = null;
    let vadState = null;
    let sr = new ort.Tensor('int64', [16000n]);
    let mediaStream = null;
    let audioContext = null;
    let analyserNode = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let vadActive = false;
    let speakingFlag = false;
    let silenceTimeout = null;
    let animationId = null;
    let silenceDelayMs = 1200;
    let modelReady = false;
    let currentAudio = null;

    // ═══════════════════ DOM ═══════════════════
    const statusSpan = document.getElementById('status-text');
    const connLed = document.getElementById('connection-led');
    const vadLed = document.getElementById('vad-led');
    const vadStateLabel = document.getElementById('vad-state-label');
    const vadBtn = document.getElementById('vadToggleBtn');
    const micAnim = document.getElementById('mic-animation');
    const vadPhrase = document.getElementById('vadPhrase');
    const energyFill = document.getElementById('energyFill');
    const chatBox = document.getElementById('chat-box') || document.getElementById('chatBox');
    const debugDiv = document.getElementById('debugConsole');
    const voiceSelect = document.getElementById('voice-select');
    const silenceSlider = document.getElementById('silence-slider');
    const silenceSpan = document.getElementById('silence-value');
    const modelBadge = document.getElementById('model-badge');

    function debugLog(msg, color = '#b8c7e7') {
        const time = new Date().toLocaleTimeString();
        const div = document.createElement('div');
        div.style.color = color;
        div.innerHTML = `[${time}] ${msg}`;
        debugDiv.appendChild(div);
        debugDiv.scrollTop = debugDiv.scrollHeight;
        while (debugDiv.children.length > 30) debugDiv.removeChild(debugDiv.children[0]);
        console.log(msg);
    }

    function addMessage(text, role) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}`;
        const timeSpan = document.createElement('div');
        timeSpan.className = 'timestamp';
        timeSpan.innerText = new Date().toLocaleTimeString();
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;
        msgDiv.appendChild(timeSpan);
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function updateEnergy(avg) {
        let pct = Math.min(100, avg * 3);
        energyFill.style.width = `${pct}%`;
        if (speakingFlag) micAnim.style.transform = `scale(${1 + pct / 200})`;
        else micAnim.style.transform = 'scale(1)';
    }

    // ═══════════════════ SILERO VAD (DIRECT) ═══════════════════
    async function loadSileroModel() {
        try {
            debugLog('Loading Silero VAD model...', '#ffcc66');
            vadSession = await ort.InferenceSession.create(MODEL_URL, {
                executionProviders: ['wasm', 'cpu']
            });
            vadState = new Float32Array(2 * 1 * 128);
            modelReady = true;
            modelBadge.textContent = 'silero v4';
            modelBadge.style.background = '#00ff9d33';
            vadBtn.disabled = false;
            vadBtn.innerHTML = '▶️ START VAD';
            vadPhrase.innerText = 'Ready';
            debugLog('✅ Silero VAD loaded', '#a0ffc0');
            addMessage('✅ Silero VAD ready. Click START.', 'ai');
            statusSpan.innerText = 'Ready';
            connLed.classList.add('active-led');
        } catch (e) {
            debugLog(`Silero failed: ${e.message}`, '#ff9090');
            addMessage('⚠️ Model failed, using energy-based VAD', 'ai');
            modelBadge.textContent = 'energy fallback';
            vadBtn.disabled = false;
            vadBtn.innerHTML = '▶️ START VAD';
            vadPhrase.innerText = 'Ready (energy)';
            statusSpan.innerText = 'Ready (fallback)';
            connLed.classList.add('active-led');
        }
    }

    async function detectSpeech(audioData) {
        if (!modelReady || !vadSession) {
            // Fallback: simple energy detection
            let sum = 0;
            for (let i = 0; i < audioData.length; i++) sum += Math.abs(audioData[i] - 128);
            return (sum / audioData.length) > 8;
        }

        try {
            const f32 = new Float32Array(audioData.length);
            for (let i = 0; i < audioData.length; i++) f32[i] = (audioData[i] - 128) / 128;
            const input = new ort.Tensor('float32', f32, [1, f32.length]);
            const stateTensor = new ort.Tensor('float32', vadState, [2, 1, 128]);
            const res = await vadSession.run({ input, state: stateTensor, sr });
            vadState = res.state.data;
            return res.output.data[0] > 0.5;
        } catch (e) {
            debugLog(`Detect error: ${e.message}`, '#ff9090');
            return false;
        }
    }

    // ═══════════════════ AUDIO SEND ═══════════════════
    async function sendAudio(blob) {
        if (!authToken || blob.size < 800) return;
        debugLog(`→ Sending ${blob.size}B`, '#88ccff');
        const fd = new FormData();
        fd.append('audio', blob, 'speech.webm');
        fd.append('voice', voiceSelect.value);

        try {
            const res = await fetch(`${GATEWAY}/voice`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${authToken}` },
                body: fd
            });
            const data = await res.json();
            if (data.transcript) addMessage(data.transcript, 'user');
            if (data.response) addMessage(data.response, 'ai');
            if (data.audio_base64) await playAudio(data.audio_base64);
        } catch (e) {
            debugLog(`Send error: ${e.message}`, '#ff9090');
        }
    }

    async function playAudio(encoded) {
        if (!encoded) return;
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }

        try {
            const isBase64 = /[+/=A-Z]/.test(encoded.substring(0, 4)) || encoded.includes('=');
            let bytes;
            if (isBase64) {
                const binary = atob(encoded);
                bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            } else {
                bytes = new Uint8Array(encoded.match(/.{1,2}/g).map(b => parseInt(b, 16)));
            }

            const blob = new Blob([bytes], { type: 'audio/mpeg' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            currentAudio = audio;
            audio.onended = () => { URL.revokeObjectURL(url); currentAudio = null; };
            audio.onerror = () => { URL.revokeObjectURL(url); currentAudio = null; };
            await audio.play();
        } catch (e) {
            debugLog(`Playback error: ${e.message}`, '#ff9090');
        }
    }

    async function finalizeSegment() {
        if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
        mediaRecorder.stop();
        await new Promise(r => {
            const check = setInterval(() => {
                if (mediaRecorder.state === 'inactive') { clearInterval(check); r(); }
            }, 20);
        });

        if (audioChunks.length) {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            audioChunks = [];
            if (blob.size > 800) await sendAudio(blob);
        }

        if (vadActive && mediaStream) {
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
            mediaRecorder.start(300);
        }
    }

    // ═══════════════════ VAD CONTROL ═══════════════════
    async function startVAD() {
        if (vadActive) return;
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            audioContext = new AudioContext();
            await audioContext.resume();
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 512;
            const source = audioContext.createMediaStreamSource(stream);
            source.connect(analyserNode);

            audioChunks = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = e => { if (e.data.size) audioChunks.push(e.data); };
            mediaRecorder.start(300);

            vadActive = true;
            vadBtn.classList.add('active');
            vadBtn.innerHTML = '⏹️ STOP VAD';
            vadStateLabel.innerText = 'VAD active';
            vadLed.classList.add('active-led');
            vadPhrase.innerText = 'Listening...';
            micAnim.innerHTML = '🎤';
            statusSpan.innerText = 'Listening';
            debugLog('✅ VAD started', '#a0ffc0');
            addMessage('🎙️ Listening...', 'ai');

            let lastSpeechResult = false;

            async function processAudio() {
                if (!vadActive || !analyserNode) return;

                const data = new Uint8Array(analyserNode.frequencyBinCount);
                analyserNode.getByteTimeDomainData(data);

                // Energy for visualization
                let sum = 0;
                for (let i = 0; i < data.length; i++) sum += Math.abs(data[i] - 128);
                const energy = (sum / data.length);
                updateEnergy(energy);

                // Silero detection
                const isSpeech = await detectSpeech(data);

                if (isSpeech && !lastSpeechResult) {
                    // Speech started
                    speakingFlag = true;
                    if (silenceTimeout) { clearTimeout(silenceTimeout); silenceTimeout = null; }
                    vadPhrase.innerText = '🎙️ SPEAKING...';
                    vadLed.classList.remove('active-led');
                    vadLed.classList.add('speak-led');
                    micAnim.innerHTML = '🎙️🔊';
                    debugLog(`🗣️ Speech (energy:${energy.toFixed(1)})`, '#88ffcc');
                } else if (!isSpeech && lastSpeechResult && speakingFlag && !silenceTimeout) {
                    // Silence started
                    debugLog(`🔇 Silence, waiting ${silenceDelayMs}ms...`, '#ffcc88');
                    silenceTimeout = setTimeout(async () => {
                        if (speakingFlag && vadActive) {
                            speakingFlag = false;
                            vadPhrase.innerText = '💭 Processing...';
                            micAnim.innerHTML = '🎤💭';
                            vadLed.classList.remove('speak-led');
                            vadLed.classList.add('active-led');
                            await finalizeSegment();
                            vadPhrase.innerText = '🎤 Listening...';
                            debugLog('✅ Segment sent', '#a0ffc0');
                        }
                        silenceTimeout = null;
                    }, silenceDelayMs);
                }

                lastSpeechResult = isSpeech;
                animationId = requestAnimationFrame(processAudio);
            }

            processAudio();
        } catch (e) {
            debugLog(`Mic error: ${e.message}`, '#ff9090');
        }
    }

    async function stopVAD() {
        vadActive = false;
        if (animationId) cancelAnimationFrame(animationId);
        if (silenceTimeout) clearTimeout(silenceTimeout);
        if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        if (audioContext) await audioContext.close();
        if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
        audioContext = null;
        analyserNode = null;
        mediaStream = null;
        vadBtn.classList.remove('active');
        vadBtn.innerHTML = '▶️ START VAD';
        vadStateLabel.innerText = 'VAD off';
        vadLed.classList.remove('active-led', 'speak-led');
        vadPhrase.innerText = modelReady ? 'Ready' : 'Ready (energy)';
        micAnim.innerHTML = '🎤';
        statusSpan.innerText = 'Stopped';
        speakingFlag = false;
        debugLog('VAD stopped', '#ffaa66');
    }

    // ═══════════════════ EVENTS ═══════════════════
    vadBtn.onclick = () => vadActive ? stopVAD() : startVAD();
    silenceSlider.oninput = () => {
        silenceDelayMs = parseFloat(silenceSlider.value) * 1000;
        silenceSpan.innerText = silenceSlider.value;
    };

    // ═══════════════════ AUTH ═══════════════════
    async function auth() {
        try {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
                body: JSON.stringify({ email: 'surf@testuser.com', password: 'Test1234!' })
            });
            const data = await res.json();
            if (data.access_token) {
                authToken = data.access_token;
                debugLog('Authenticated', '#a0ffc0');
            } else {
                debugLog('Auth failed', '#ff9090');
            }
        } catch (e) {
            debugLog(`Auth error: ${e.message}`, '#ff9090');
        }
    }

    // ═══════════════════ INIT ═══════════════════
    debugLog('Starting...', '#a0ffc0');
    auth();
    loadSileroModel();
</script>
</body>
</html>
