<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surf Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ff9d; margin-bottom: 5px; font-size: 1.4rem; }
        #status-bar {
            display: flex; gap: 10px; align-items: center; margin-bottom: 12px;
            background: #16213e; padding: 8px 16px; border-radius: 20px;
        }
        #status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; }
        #status-dot.on { background: #00ff9d; box-shadow: 0 0 8px #00ff9d; }
        #status-dot.recording { background: #ff4444; animation: pulse 0.8s infinite; }
        #status-text { font-size: 12px; color: #aaa; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        #mode-tabs {
            display: flex; gap: 4px; margin-bottom: 10px;
            background: #16213e; border-radius: 10px; padding: 3px;
        }
        .mode-tab {
            padding: 7px 16px; border: none; border-radius: 8px;
            cursor: pointer; font-size: 13px; font-weight: 600;
            background: transparent; color: #777; transition: all 0.2s;
        }
        .mode-tab.active { background: #00ff9d; color: #000; }

        #chat-box {
            width: 100%; max-width: 500px; height: 220px;
            overflow-y: auto; background: #16213e; border-radius: 12px;
            padding: 12px; margin-bottom: 8px; border: 1px solid #333;
        }
        .msg { margin-bottom: 5px; padding: 5px 10px; border-radius: 8px; max-width: 85%; font-size: 13px; }
        .msg.user { background: #00ff9d22; border: 1px solid #00ff9d44; margin-left: auto; }
        .msg.ai { background: #2a2a3e; margin-right: auto; }
        .msg.system { text-align: center; font-size: 10px; color: #555; }
        .msg .time { font-size: 9px; color: #555; display: block; }

        #input-area { display: flex; width: 100%; max-width: 500px; gap: 8px; margin-bottom: 8px; }
        #text-input {
            flex: 1; padding: 10px 14px; border-radius: 8px;
            border: 1px solid #444; background: #16213e; color: #fff; font-size: 14px;
        }
        #text-input:disabled { opacity: 0.4; }
        #action-btn {
            padding: 10px 20px; border: none; border-radius: 8px;
            cursor: pointer; font-weight: 600; font-size: 14px; min-width: 80px;
        }

        /* Debug panel */
        #debug-panel {
            width: 100%; max-width: 500px; background: #0d1117;
            border: 1px solid #2a2a3e; border-radius: 8px; padding: 8px 10px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            font-size: 10px; max-height: 120px; overflow-y: auto;
        }
        #debug-panel .log-line { padding: 1px 0; border-bottom: 1px solid #0a0a0a; white-space: nowrap; }
        .log-sent { color: #ffaa00; } .log-recv { color: #00aaff; }
        .log-info { color: #8a9aaa; } .log-err { color: #ff4444; }
        .log-success { color: #00ff9d; }
        .log-line .ts { color: #444; margin-right: 8px; }

        #sandbox-frame { display: none; }
    </style>
</head>
<body>
    <h1>🏄 Surf Voice</h1>

    <div id="status-bar">
        <div id="status-dot"></div>
        <span id="status-text">Loading...</span>
    </div>

    <div id="mode-tabs">
        <button class="mode-tab active" data-mode="text">💬 Chat</button>
        <button class="mode-tab" data-mode="rest">🎤 Push-to-Talk</button>
        <button class="mode-tab" data-mode="vad">⚡ Real-time</button>
    </div>

    <div id="chat-box"></div>

    <div id="input-area">
        <input id="text-input" placeholder="Type a message..." />
        <button id="action-btn">Send</button>
    </div>

    <!-- Debug logs -->
    <div id="debug-panel"></div>

    <iframe id="sandbox-frame" src="https://ashirafnewton-ait.github.io/extension/" allow="microphone; autoplay"></iframe>

    <script>
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';

        let authToken = null;
        let sandboxReady = false;
        let currentMode = 'text';
        let micActive = false;
        let pttHeld = false;

        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const chatBox = document.getElementById('chat-box');
        const textInput = document.getElementById('text-input');
        const actionBtn = document.getElementById('action-btn');
        const sandboxFrame = document.getElementById('sandbox-frame');
        const debugPanel = document.getElementById('debug-panel');

        // ════════════ DEBUG LOGGER ════════════
        function debug(msg, cls = 'log-info') {
            const ts = new Date().toLocaleTimeString().split(' ')[1] || new Date().toLocaleTimeString();
            debugPanel.innerHTML += `<div class="log-line ${cls}"><span class="ts">${ts}</span>${msg}</div>`;
            debugPanel.scrollTop = debugPanel.scrollHeight;
            // Keep only last 50 lines
            while (debugPanel.children.length > 50) debugPanel.removeChild(debugPanel.children[0]);
            console.log(`[${cls}]`, msg);
        }

        function post(msg) {
            debug(`→ ${msg.type}`, 'log-sent');
            sandboxFrame.contentWindow.postMessage(msg, '*');
        }

        function log(text, type = 'system') {
            const t = new Date().toLocaleTimeString();
            chatBox.innerHTML += `<div class="msg ${type}"><span class="time">${t}</span>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ════════════ MODES ════════════
        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                setMode(tab.dataset.mode);
            });
        });

        function setMode(mode) {
            if (micActive) { post({ type: 'stop_mic' }); micActive = false; }
            if (pttHeld) { post({ type: 'stop_mic' }); pttHeld = false; }
            currentMode = mode;
            debug(`Mode: ${mode}`, 'log-info');

            switch (mode) {
                case 'text':
                    textInput.disabled = false;
                    textInput.placeholder = 'Type a message...';
                    actionBtn.textContent = 'Send';
                    actionBtn.style.background = '#00ff9d'; actionBtn.style.color = '#000';
                    actionBtn.onpointerdown = null; actionBtn.onpointerup = null;
                    statusText.textContent = 'Text Chat'; statusDot.className = 'on';
                    break;
                case 'rest':
                    textInput.disabled = true;
                    textInput.placeholder = 'Hold button to talk...';
                    actionBtn.textContent = '🎤 Hold';
                    actionBtn.style.background = '#333'; actionBtn.style.color = '#fff';
                    actionBtn.onpointerdown = () => {
                        if (!sandboxReady || !authToken) { debug('Not ready', 'log-err'); return; }
                        pttHeld = true; post({ type: 'start_mic' }); micActive = true;
                        actionBtn.style.background = '#ff4444'; actionBtn.textContent = '🎤 Release';
                        statusDot.className = 'recording'; statusText.textContent = 'Recording...';
                        debug('PTT: recording started', 'log-sent');
                    };
                    actionBtn.onpointerup = () => {
                        if (!pttHeld) return; pttHeld = false;
                        post({ type: 'stop_mic' }); micActive = false;
                        actionBtn.style.background = '#333'; actionBtn.textContent = '🎤 Hold';
                        statusDot.className = 'on'; statusText.textContent = 'Push-to-Talk';
                        debug('PTT: recording stopped', 'log-sent');
                    };
                    actionBtn.onpointerleave = () => { if (pttHeld) actionBtn.onpointerup(); };
                    statusText.textContent = 'Push-to-Talk'; statusDot.className = 'on';
                    break;
                case 'vad':
                    textInput.disabled = true;
                    textInput.placeholder = 'Real-time mode active...';
                    actionBtn.textContent = '▶️ Start';
                    actionBtn.style.background = '#ff8800'; actionBtn.style.color = '#fff';
                    actionBtn.onpointerdown = null; actionBtn.onpointerup = null;
                    actionBtn.onclick = () => {
                        if (!sandboxReady || !authToken) { debug('Not ready', 'log-err'); return; }
                        if (micActive) {
                            post({ type: 'stop_mic' }); micActive = false;
                            actionBtn.textContent = '▶️ Start'; actionBtn.style.background = '#ff8800';
                            statusDot.className = 'on'; statusText.textContent = 'Real-time (stopped)';
                            debug('VAD: stopped', 'log-info');
                        } else {
                            post({ type: 'start_mic' }); micActive = true;
                            actionBtn.textContent = '⏹️ Stop'; actionBtn.style.background = '#ff4444';
                            statusDot.className = 'recording'; statusText.textContent = 'Listening...';
                            debug('VAD: started', 'log-sent');
                        }
                    };
                    statusText.textContent = 'Real-time (stopped)'; statusDot.className = 'on';
                    break;
            }
        }

        // ════════════ TEXT SEND ════════════
        async function sendText(text) {
            if (!authToken || !text.trim()) return;
            debug(`Text: "${text.substring(0, 40)}"`, 'log-sent');
            log(text, 'user'); textInput.value = '';
            try {
                const res = await fetch(`${GATEWAY}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${authToken}` },
                    body: JSON.stringify({ text, voice: 'en-US-AriaNeural' })
                });
                const data = await res.json();
                debug(`Chat response [${res.status}]: keys=[${Object.keys(data).join(',')}]`, 'log-recv');
                if (data.response) log('🤖 ' + data.response, 'ai');
                if (data.audio_base64) { debug(`Audio: ${data.audio_base64.length} chars`, 'log-recv'); playAudio(data.audio_base64); }
            } catch (e) { debug(`Chat error: ${e.message}`, 'log-err'); }
        }

        actionBtn.addEventListener('click', (e) => {
            if (currentMode === 'text') sendText(textInput.value);
        });
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && currentMode === 'text') sendText(textInput.value);
        });

        function playAudio(encoded) {
            if (!encoded) return;
            let bytes;
            const isBase64 = /[+/=A-Z]/.test(encoded.substring(0, 4)) || encoded.includes('=');
            if (isBase64) {
                const b = atob(encoded); bytes = new Uint8Array(b.length);
                for (let i = 0; i < b.length; i++) bytes[i] = b.charCodeAt(i);
            } else { bytes = new Uint8Array(encoded.match(/.{1,2}/g).map(b => parseInt(b, 16))); }
            new Audio(URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }))).play();
            debug(`TTS playing: ${bytes.length} bytes`, 'log-success');
        }

        // ════════════ SANDBOX MESSAGES ════════════
        window.addEventListener('message', (e) => {
            if (!e.origin.includes('ashirafnewton-ait.github.io')) return;
            const m = e.data;
            debug(`← ${m.type}${m.text ? ': ' + m.text.substring(0, 50) : ''}`, 'log-recv');

            switch (m.type) {
                case 'sandbox_ready':
                    sandboxReady = true;
                    statusDot.className = 'on'; statusText.textContent = 'Ready';
                    debug('Sandbox READY ✅', 'log-success');
                    log('✅ Sandbox ready', 'system');
                    if (authToken) { post({ type: 'auth_token', token: authToken }); debug('Token sent to sandbox', 'log-sent'); }
                    break;
                case 'token_received':
                    debug('Sandbox confirmed token', 'log-success');
                    break;
                case 'status':
                    statusText.textContent = m.text;
                    break;
                case 'streaming':
                    statusDot.className = m.mode === 'sfu' ? 'on' : 'recording';
                    break;
                case 'transcript':
                    log('📝 ' + m.text, 'user');
                    break;
                case 'response':
                    log('🤖 ' + m.text, 'ai');
                    break;
                case 'tts_playing':
                    statusText.textContent = '🔊 Speaking...';
                    debug('TTS playing', 'log-success');
                    break;
                case 'disconnected':
                    micActive = false;
                    if (currentMode === 'vad') { actionBtn.textContent = '▶️ Start'; actionBtn.style.background = '#ff8800'; }
                    if (currentMode === 'rest') { actionBtn.textContent = '🎤 Hold'; actionBtn.style.background = '#333'; }
                    statusDot.className = 'on'; statusText.textContent = 'Stopped';
                    debug('Sandbox disconnected', 'log-err');
                    break;
                case 'error':
                    debug(`Sandbox error: ${m.message}`, 'log-err');
                    log('⚠️ ' + m.message, 'system');
                    break;
            }
        });

        // ════════════ AUTH ════════════
        async function login() {
            debug('Logging in...', 'log-info');
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
                    body: JSON.stringify({ email: 'surf@testuser.com', password: 'Test1234!' })
                });
                const data = await res.json();
                if (data.access_token) {
                    authToken = data.access_token;
                    debug('Auth OK', 'log-success');
                    if (sandboxReady) { post({ type: 'auth_token', token: authToken }); }
                } else { debug('Auth failed', 'log-err'); }
            } catch (e) { debug(`Auth error: ${e.message}`, 'log-err'); }
        }

        // ════════════ INIT ════════════
        debug('Client starting...', 'log-info');
        debug(`Gateway: ${GATEWAY}`, 'log-info');
        setMode('text');
        login();
    </script>
</body>
</html>
