<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Voice & Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ff9d; margin-bottom: 5px; }
        #status {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 10px;
            background: #333;
        }
        #status.connected { background: #00ff9d33; color: #00ff9d; }
        #status.recording { background: #ff444433; color: #ff4444; }
        #status.speaking { background: #00aaff33; color: #00aaff; }

        #chat-box {
            width: 100%;
            max-width: 500px;
            height: 300px;
            overflow-y: auto;
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 85%; font-size: 14px; }
        .msg.user { background: #00ff9d22; border: 1px solid #00ff9d44; margin-left: auto; }
        .msg.ai { background: #333; margin-right: auto; }
        .msg.system { text-align: center; font-size: 11px; color: #888; }
        .msg.error { background: #ff444422; color: #ff6666; text-align: center; font-size: 12px; }
        .msg .time { font-size: 10px; color: #666; display: block; }

        #input-area {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 8px;
            margin-bottom: 15px;
        }
        #text-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #16213e;
            color: #fff;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        #send-btn { background: #00ff9d; color: #000; }
        #mic-btn { 
            background: #333; 
            color: #fff;
            width: 50px;
            font-size: 20px;
            user-select: none;
        }
        #mic-btn.recording { background: #ff4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        #voice-select {
            padding: 8px;
            border-radius: 6px;
            background: #16213e;
            color: #fff;
            border: 1px solid #444;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>🏄 Surf Voice</h1>
    <div id="status">Disconnected</div>

    <select id="voice-select">
        <option value="en-US-AriaNeural">🇺🇸 Aria (Female)</option>
        <option value="en-US-GuyNeural">🇺🇸 Guy (Male)</option>
        <option value="en-GB-SoniaNeural">🇬🇧 Sonia (Female)</option>
        <option value="en-GB-RyanNeural">🇬🇧 Ryan (Male)</option>
    </select>

    <div id="chat-box"></div>

    <div id="input-area">
        <button id="mic-btn">🎤</button>
        <input id="text-input" placeholder="Type a message..." />
        <button id="send-btn">Send</button>
    </div>

    <script>
        // ═══════════════════════════════════
        // CONFIG
        // ═══════════════════════════════════
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';

        let authToken = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentAudio = null;

        const statusEl = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const voiceSelect = document.getElementById('voice-select');

        function log(text, type = 'system') {
            const time = new Date().toLocaleTimeString();
            chatBox.innerHTML += `<div class="msg ${type}"><span class="time">${time}</span>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setStatus(text, cls = '') {
            statusEl.textContent = text;
            statusEl.className = cls;
        }

        // ═══════════════════════════════════
        // AUTH
        // ═══════════════════════════════════
        async function login(email, password) {
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'apikey': ANON_KEY },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    authToken = data.access_token;
                    setStatus('Connected ✅', 'connected');
                    log('🔐 Logged in');
                    return true;
                }
                log('❌ Login failed', 'error');
                return false;
            } catch (e) {
                log('❌ Login error: ' + e.message, 'error');
                return false;
            }
        }

        // ═══════════════════════════════════
        // TEXT CHAT
        // ═══════════════════════════════════
        async function sendText(text) {
            if (!authToken || !text.trim()) return;
            log(text, 'user');
            textInput.value = '';

            try {
                const res = await fetch(`${GATEWAY}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({ text, voice: voiceSelect.value })
                });
                const data = await res.json();
                console.log('CHAT RESPONSE:', JSON.stringify(data).substring(0, 300));

                if (data.response) log('🤖 ' + data.response, 'ai');
                if (data.audio_base64) await playAudio(data.audio_base64);
            } catch (e) {
                log('❌ Chat error: ' + e.message, 'error');
            }
        }

        // ═══════════════════════════════════
        // VOICE RECORDING
        // ═══════════════════════════════════
        async function startRecording() {
            if (!authToken) return log('❌ Login first', 'error');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    await sendAudio(blob);
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                setStatus('🎤 Recording...', 'recording');
            } catch (e) {
                log('❌ Mic error: ' + e.message, 'error');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                setStatus('Connected ✅', 'connected');
            }
        }

        async function sendAudio(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');
            formData.append('voice', voiceSelect.value);

            try {
                const res = await fetch(`${GATEWAY}/voice`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });
                const data = await res.json();
                console.log('VOICE RESPONSE:', JSON.stringify(data).substring(0, 300));

                if (data.transcript) log('📝 ' + data.transcript, 'user');
                if (data.response) log('🤖 ' + data.response, 'ai');
                if (data.audio_base64) await playAudio(data.audio_base64);
            } catch (e) {
                log('❌ Voice error: ' + e.message, 'error');
            }
        }

        // ═══════════════════════════════════
        // TTS PLAYBACK - FIXED
        // ═══════════════════════════════════
        async function playAudio(encoded) {
            if (!encoded) return;

            // Stop previous audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            try {
                // Dump first 50 chars for debugging
                const preview = encoded.substring(0, 50);
                console.log('AUDIO PREVIEW:', preview);
                console.log('AUDIO LENGTH:', encoded.length);

                let bytes;

                // Check if it's hex (only 0-9, a-f)
                if (/^[0-9a-f]+$/i.test(encoded)) {
                    console.log('DETECTED: HEX format');
                    bytes = new Uint8Array(encoded.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                } else {
                    console.log('DETECTED: BASE64 format');
                    const binary = atob(encoded);
                    bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                }

                console.log('BYTES:', bytes.length);

                // Check magic bytes to detect format
                const magic = Array.from(bytes.slice(0, 4)).map(b => b.toString(16).padStart(2, '0')).join(' ');
                console.log('MAGIC BYTES:', magic);

                // Determine mime type from magic bytes
                let mimeType = 'audio/mpeg'; // default
                if (bytes[0] === 0xFF && (bytes[1] & 0xE0) === 0xE0) {
                    mimeType = 'audio/mpeg';
                    console.log('FORMAT: MP3');
                } else if (bytes[0] === 0x52 && bytes[1] === 0x49 && bytes[2] === 0x46 && bytes[3] === 0x46) {
                    mimeType = 'audio/wav';
                    console.log('FORMAT: WAV');
                } else if (bytes[0] === 0x4F && bytes[1] === 0x67 && bytes[2] === 0x67 && bytes[3] === 0x53) {
                    mimeType = 'audio/ogg';
                    console.log('FORMAT: OGG/OPUS');
                } else {
                    console.log('FORMAT: UNKNOWN, trying mp3');
                }

                const blob = new Blob([bytes], { type: mimeType });
                const url = URL.createObjectURL(blob);
                const audio = new Audio(url);
                currentAudio = audio;

                audio.onplay = () => setStatus('🔊 Speaking...', 'speaking');
                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    setStatus('Connected ✅', 'connected');
                };
                audio.onerror = (e) => {
                    console.error('AUDIO ERROR:', audio.error?.code, audio.error?.message);
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    setStatus('Connected ✅', 'connected');
                    log('⚠️ Audio: ' + (audio.error?.message || 'format not supported'), 'error');
                };

                await audio.play();
            } catch (e) {
                console.error('PLAYBACK ERROR:', e.message);
                log('⚠️ Audio: ' + e.message, 'error');
            }
        }

        // ═══════════════════════════════════
        // EVENTS
        // ═══════════════════════════════════
        sendBtn.onclick = () => sendText(textInput.value);
        textInput.onkeydown = (e) => { if (e.key === 'Enter') sendText(textInput.value); };

        micBtn.onmousedown = startRecording;
        micBtn.onmouseup = stopRecording;
        micBtn.onmouseleave = () => { if (isRecording) stopRecording(); };
        micBtn.ontouchstart = (e) => { e.preventDefault(); startRecording(); };
        micBtn.ontouchend = stopRecording;

        // ═══════════════════════════════════
        // START
        // ═══════════════════════════════════
        log('🏄 Surf Voice Client ready');
        login('surf@testuser.com', 'Test1234!');
    </script>
</body>
</html>
