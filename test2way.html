<!DOCTYPE html>
<html>
<head>
    <title>Debug - Connect Test</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 20px; }
        button { background: #1a1a1a; color: #0f0; border: 1px solid #0f0; padding: 15px 30px; font-size: 16px; cursor: pointer; }
        #log { background: #000; padding: 15px; margin-top: 20px; height: 300px; overflow-y: auto; }
    </style>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>
<body>
    <h1>🔌 Minimal Connect Test</h1>
    
    <button id="btn">Click to Connect</button>
    
    <div id="log">Ready. Click the button.</div>

    <script>
        // Wait for DOM to be ready
        document.addEventListener('DOMContentLoaded', function() {
            
            const log = function(msg, color) {
                const div = document.getElementById('log');
                div.innerHTML += '<div style="color:' + (color || '#0f0') + '">[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>';
                div.scrollTop = div.scrollHeight;
                console.log(msg);
            };
            
            const btn = document.getElementById('btn');
            
            btn.onclick = function() {
                log('Button clicked!', '#ff0');
                btn.disabled = true;
                btn.textContent = 'Connecting...';
                
                const socket = io('https://surf-gateway.onrender.com', {
                    transports: ['websocket']
                });
                
                socket.on('connect', function() {
                    log('✅ Connected to gateway! SID: ' + socket.id, '#0f0');
                    btn.textContent = '✅ Connected';
                });
                
                socket.on('connect_error', function(err) {
                    log('❌ Connection error: ' + err.message, '#f00');
                    btn.disabled = false;
                    btn.textContent = 'Click to Connect';
                });
                
                socket.on('disconnect', function() {
                    log('🔌 Disconnected', '#f80');
                });
            };
            
            log('✅ Page loaded. Button ready.', '#0f0');
        });
    </script>
</body>
</html>
