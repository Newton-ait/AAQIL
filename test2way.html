<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Surf AI — Full Test Suite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0F172A;
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container { width: 100%; max-width: 500px; }
        h1 { font-size: 20px; margin-bottom: 8px; }
        .gradient-text { background: linear-gradient(135deg, #3B82F6, #60A5FA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .card { background: #1E293B; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
        .card h3 { font-size: 12px; color: #94A3B8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
        
        .status-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .dot.green { background: #22C55E; }
        .dot.red { background: #EF4444; }
        .dot.yellow { background: #F59E0B; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        
        .btn { padding: 8px 14px; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; margin: 3px; }
        .btn-blue { background: #3B82F6; color: white; }
        .btn-red { background: #EF4444; color: white; }
        .btn-green { background: #22C55E; color: #000; }
        .btn-orange { background: #F59E0B; color: #000; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; }
        
        .input { width: 100%; padding: 8px 12px; border: 1px solid #334155; border-radius: 8px; background: #0F172A; color: #E2E8F0; font-size: 13px; margin: 4px 0; }
        select { width: 100%; padding: 8px 12px; border: 1px solid #334155; border-radius: 8px; background: #0F172A; color: #E2E8F0; font-size: 13px; margin: 4px 0; }
        
        .log-box { background: #0F172A; border-radius: 10px; padding: 10px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 10px; border: 1px solid #334155; }
        .log-box div { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
        .l-sent { color: #F59E0B; } .l-rec { color: #3B82F6; } .l-ok { color: #22C55E; } .l-err { color: #EF4444; }
        
        .chat-box { background: #1E293B; border-radius: 14px; padding: 12px; height: 200px; overflow-y: auto; margin-bottom: 8px; font-size: 12px; }
        .msg { margin-bottom: 6px; padding: 6px 10px; border-radius: 10px; max-width: 85%; line-height: 1.4; }
        .msg.user { background: #3B82F6; margin-left: auto; border-bottom-right-radius: 3px; }
        .msg.ai { background: #334155; margin-right: auto; border-bottom-left-radius: 3px; }
        .msg.system { text-align: center; font-size: 10px; color: #64748B; }
        .msg .t { font-size: 9px; color: #64748B; display: block; }
        
        .flex { display: flex; gap: 6px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏄 Surf <span class="gradient-text">AI</span> — Test Suite</h1>
    
    <!-- STATUS -->
    <div class="card">
        <h3>📡 Status</h3>
        <div class="status-row"><span>Sandbox</span><span><span class="dot yellow" id="sbDot"></span><span id="sbStatus">Connecting...</span></span></div>
        <div class="status-row"><span>Auth</span><span id="authStatus">Not logged in</span></div>
        <div class="status-row"><span>Mic</span><span id="micStatus">Idle</span></div>
        <div class="status-row"><span>Mode</span><span id="modeStatus">text</span></div>
    </div>
    
    <!-- AUTH -->
    <div class="card" id="authCard">
        <h3>🔐 Auth</h3>
        <input class="input" id="email" value="surf@testuser.com" placeholder="Email">
        <input class="input" id="password" type="password" value="Test1234!" placeholder="Password">
        <button class="btn btn-blue" id="loginBtn">Sign In</button>
        <button class="btn btn-red hidden" id="logoutBtn">Sign Out</button>
    </div>
    
    <!-- CHAT -->
    <div class="card">
        <h3>💬 Chat</h3>
        <div class="chat-box" id="chatBox"><div class="msg system">Send a message to test...</div></div>
        <div class="flex">
            <input class="input" id="chatInput" placeholder="Type message...">
            <button class="btn btn-blue" id="sendBtn">Send</button>
        </div>
    </div>
    
    <!-- MIC MODES -->
    <div class="card">
        <h3>🎤 Mic Modes</h3>
        <div class="grid2">
            <button class="btn btn-orange" id="pttBtn">🎤 PTT Hold</button>
            <button class="btn btn-green" id="vadBtn">⚡ VAD On</button>
        </div>
        <button class="btn btn-red" id="stopBtn" style="width:100%;margin-top:6px;">⏹️ Stop Mic</button>
    </div>
    
    <!-- VOICE SELECT -->
    <div class="card">
        <h3>🎵 Voice</h3>
        <select id="voiceSelect">
            <option value="en-US-AriaNeural">🇺🇸 Aria (Female)</option>
            <option value="en-US-GuyNeural">🇺🇸 Guy (Male)</option>
            <option value="en-GB-SoniaNeural">🇬🇧 Sonia (Female)</option>
            <option value="en-GB-RyanNeural">🇬🇧 Ryan (Male)</option>
        </select>
        <button class="btn btn-blue" id="setVoiceBtn">Set Voice</button>
    </div>
    
    <!-- LOGS -->
    <div class="card">
        <h3>📋 Logs</h3>
        <div class="log-box" id="logBox"></div>
    </div>
</div>

<iframe id="sandboxIframe" src="https://ashirafnewton-ait.github.io/extension/?v=99" allow="microphone; autoplay" style="display:none;"></iframe>

<script>
    const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';

    let authToken = null, sandboxReady = false, micActive = false, micPermissionGranted = false;

    function log(msg, cls = '') {
        const ts = new Date().toLocaleTimeString();
        document.getElementById('logBox').innerHTML += `<div class="${cls}">[${ts}] ${msg}</div>`;
        document.getElementById('logBox').scrollTop = document.getElementById('logBox').scrollHeight;
    }

    function chatMsg(text, role) {
        const t = new Date().toLocaleTimeString().slice(0,5);
        document.getElementById('chatBox').innerHTML += `<div class="msg ${role}"><span class="t">${t}</span>${text}</div>`;
        document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    function post(msg) {
        log(`→ ${msg.type || msg.action}: ${JSON.stringify(msg).substring(0,60)}`, 'l-sent');
        document.getElementById('sandboxIframe').contentWindow.postMessage(msg, 'https://ashirafnewton-ait.github.io');
    }

    // AUTH
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        log(`Logging in as ${email}...`);
        try {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
                body: JSON.stringify({ email, password: pass })
            });
            const data = await res.json();
            if (data.access_token) {
                authToken = data.access_token;
                document.getElementById('authStatus').innerHTML = `✅ ${email}`;
                document.getElementById('authCard').querySelector('h3').textContent = '🔐 Auth ✅';
                log('Auth OK', 'l-ok');
                if (sandboxReady) post({ type: 'auth_token', token: authToken });
            } else {
                log('Auth failed: ' + (data.error_description || 'unknown'), 'l-err');
            }
        } catch (e) { log('Auth error: ' + e.message, 'l-err'); }
    });

    // SANDBOX MESSAGES
    window.addEventListener('message', (e) => {
        if (!e.origin.includes('ashirafnewton-ait.github.io')) return;
        const m = e.data;
        const preview = m.text ? `: ${(m.text||'').substring(0,30)}` : '';
        log(`← ${m.type}${preview}`, 'l-rec');

        switch (m.type) {
            case 'sandbox_ready':
                sandboxReady = true;
                document.getElementById('sbDot').className = 'dot green';
                document.getElementById('sbStatus').textContent = 'Ready';
                log('Sandbox ready ✅', 'l-ok');
                if (authToken) post({ type: 'auth_token', token: authToken });
                break;
            case 'token_received': break;
            case 'status': document.getElementById('micStatus').textContent = m.text; break;
            case 'streaming': document.getElementById('micStatus').textContent = '🎙️ Streaming...'; break;
            case 'transcript': chatMsg('🎤 ' + m.text, 'user'); break;
            case 'response': chatMsg('🤖 ' + m.text, 'ai'); break;
            case 'chat_response': chatMsg('🤖 ' + m.text, 'ai'); break;
            case 'disconnected':
                micActive = false;
                document.getElementById('micStatus').textContent = 'Idle';
                break;
            case 'error': log('Error: ' + m.message, 'l-err'); break;
        }
    });

    // TEXT CHAT
    document.getElementById('sendBtn').addEventListener('click', () => {
        const text = document.getElementById('chatInput').value.trim();
        if (!text || !authToken) return;
        chatMsg(text, 'user');
        document.getElementById('chatInput').value = '';
        post({ type: 'extension_command', action: 'sendText', text });
    });

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('sendBtn').click();
    });

    // MIC MODES
    async function ensureMic(callback) {
        if (micPermissionGranted) return callback();
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(t => t.stop());
            micPermissionGranted = true;
            callback();
        } catch (e) { log('Mic denied: ' + e.message, 'l-err'); }
    }

    // PTT Hold
    document.getElementById('pttBtn').addEventListener('mousedown', () => {
        ensureMic(() => {
            post({ type: 'extension_command', action: 'startMic', mode: 'ptt' });
            micActive = true;
            document.getElementById('micStatus').textContent = '🎤 Recording...';
            log('PTT: recording', 'l-sent');
        });
    });
    document.getElementById('pttBtn').addEventListener('mouseup', () => {
        if (micActive) {
            post({ type: 'extension_command', action: 'stopMic' });
            micActive = false;
            document.getElementById('micStatus').textContent = 'Idle';
            log('PTT: stopped', 'l-sent');
        }
    });
    document.getElementById('pttBtn').addEventListener('mouseleave', () => {
        if (micActive) {
            post({ type: 'extension_command', action: 'stopMic' });
            micActive = false;
            document.getElementById('micStatus').textContent = 'Idle';
        }
    });

    // VAD Toggle
    let vadOn = false;
    document.getElementById('vadBtn').addEventListener('click', () => {
        ensureMic(() => {
            if (vadOn) {
                post({ type: 'extension_command', action: 'stopMic' });
                micActive = false; vadOn = false;
                document.getElementById('vadBtn').textContent = '⚡ VAD On';
                document.getElementById('vadBtn').className = 'btn btn-green';
                document.getElementById('micStatus').textContent = 'Idle';
                log('VAD: stopped', 'l-sent');
            } else {
                post({ type: 'extension_command', action: 'startMic', mode: 'vad' });
                micActive = true; vadOn = true;
                document.getElementById('vadBtn').textContent = '⏹️ VAD Off';
                document.getElementById('vadBtn').className = 'btn btn-red';
                document.getElementById('micStatus').textContent = '⚡ VAD Listening...';
                log('VAD: started', 'l-sent');
            }
        });
    });

    // Stop All
    document.getElementById('stopBtn').addEventListener('click', () => {
        if (micActive) {
            post({ type: 'extension_command', action: 'stopMic' });
            micActive = false; vadOn = false;
            document.getElementById('vadBtn').textContent = '⚡ VAD On';
            document.getElementById('vadBtn').className = 'btn btn-green';
            document.getElementById('micStatus').textContent = 'Idle';
            log('All mic stopped', 'l-sent');
        }
    });

    // SET VOICE
    document.getElementById('setVoiceBtn').addEventListener('click', () => {
        const voice = document.getElementById('voiceSelect').value;
        post({ type: 'extension_command', action: 'setVoice', voice });
        log('Voice set: ' + voice, 'l-ok');
    });

    log('Test suite loaded — waiting for sandbox...');
</script>
</body>
</html>
