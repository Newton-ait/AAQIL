<!DOCTYPE html>
<html>
<head>
    <title>Surf Voice - Event-Based</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 20px; }
        button { background: #1a1a1a; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:disabled { opacity: 0.3; }
        .log { background: #000; padding: 15px; margin-top: 20px; height: 400px; overflow-y: auto; }
    </style>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>
<body>
    <h1>🌊 Surf Voice - Event-Based</h1>
    <p>Using the proven event-based pattern</p>
    
    <div>
        <button id="connectBtn" onclick="doConnect()">1️⃣ Connect & Get Caps</button>
        <button id="producersBtn" onclick="doGetProducers()" disabled>2️⃣ Get Producers</button>
        <button id="micBtn" onclick="doStartMic()" disabled>3️⃣ Start Mic (REST)</button>
    </div>
    
    <div class="log" id="log">Ready...</div>

    <script>
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SERVICE_PIN = 'ndu2026';
        let socket, stream, mediaRecorder, audioChunks;
        
        function log(msg, color = '#0f0') {
            const div = document.getElementById('log');
            div.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }
        
        window.doConnect = function() {
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            
            socket = io(GATEWAY, { transports: ['websocket'] });
            
            // Event-based listeners (what actually works)
            socket.on('routerRtpCapabilities', (caps) => {
                log('✅ Router caps received!', '#0ff');
                log(`   Codecs: ${caps.codecs?.map(c => c.mimeType).join(', ')}`, '#888');
                document.getElementById('producersBtn').disabled = false;
                btn.textContent = '✅ Connected';
            });
            
            socket.on('producersList', (producers) => {
                log(`📋 Producers: ${producers.length}`, '#0ff');
                producers.forEach(p => {
                    log(`   - ${p.producerId.slice(0,20)}... (${p.kind})`, '#888');
                });
                if (producers.length === 0) {
                    log('   No producers yet - start your mic!', '#888');
                }
            });
            
            socket.on('producer_added', (data) => {
                log(`🎬 New producer: ${data.producerId.slice(0,20)}... (${data.kind})`, '#0f0');
            });
            
            socket.on('tts_audio', (data) => {
                try {
                    const audioBytes = Uint8Array.from(
                        data.audio.match(/.{1,2}/g).map(byte => parseInt(byte, 16))
                    );
                    const audio = new Audio(URL.createObjectURL(new Blob([audioBytes], { type: 'audio/mpeg' })));
                    audio.play();
                    log('🔊 Playing TTS response', '#0ff');
                } catch(e) {
                    log('❌ TTS error: ' + e.message, '#f00');
                }
            });
            
            socket.on('connect', () => {
                log('✅ Socket connected', '#0f0');
                // Request caps using EMIT (not call)
                socket.emit('getRouterRtpCapabilities');
            });
            
            socket.on('connect_error', (e) => log('❌ ' + e.message, '#f00));
        };
        
        window.doGetProducers = function() {
            log('📡 Requesting producers list...', '#ff0');
            socket.emit('getProducers');
            document.getElementById('micBtn').disabled = false;
        };
        
        window.doStartMic = async function() {
            const btn = document.getElementById('micBtn');
            btn.disabled = true;
            btn.textContent = 'Recording...';
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log('🎤 Mic ready', '#0f0');
                
                // Use REST fallback since it's proven working
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendToREST(blob);
                };
                
                // Record in 3-second chunks
                mediaRecorder.start(3000);
                
                // Auto-send every 3 seconds
                setInterval(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        mediaRecorder.start(3000);
                    }
                }, 3000);
                
                log('🎤 Recording in 3s chunks...', '#0f0');
                btn.textContent = '🎤 Recording';
                
            } catch(e) {
                log('❌ Mic error: ' + e.message, '#f00');
                btn.disabled = false;
                btn.textContent = '3️⃣ Start Mic (REST)';
            }
        };
        
        async function sendToREST(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'chunk.wav');
            formData.append('voice', 'en-US-AriaNeural');
            
            try {
                const res = await fetch(`${GATEWAY}/voice`, {
                    method: 'POST',
                    headers: { 'x-pin': SERVICE_PIN },
                    body: formData
                });
                
                const data = await res.json();
                if (data.transcript) log(`📝 ${data.transcript}`, '#fff');
                if (data.response) log(`🤖 ${data.response}`, '#0ff');
                
                if (data.audio_base64) {
                    const audioBytes = Uint8Array.from(
                        data.audio_base64.match(/.{1,2}/g).map(byte => parseInt(byte, 16))
                    );
                    const audio = new Audio(URL.createObjectURL(new Blob([audioBytes], { type: 'audio/mpeg' })));
                    audio.play();
                }
            } catch(e) {
                log('❌ REST error: ' + e.message, '#f00');
            }
        }
    </script>
</body>
</html>
