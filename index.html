<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Voice Conversation</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Fira Code', monospace;
            background: linear-gradient(135deg, #0a0f0a 0%, #0c120c 100%);
            color: #cfc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            border-left: 5px solid #0f0;
            padding-left: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status-badge {
            background: #1f3a1f;
            color: #8eff8e;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .conversation-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .chat-panel {
            background: #0c100c;
            border: 1px solid #2f8f2f;
            border-radius: 28px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 10px;
        }
        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-user {
            text-align: right;
        }
        .message-user .bubble {
            background: #1a3a1a;
            color: #a8ffa8;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 24px 24px 4px 24px;
            max-width: 80%;
        }
        .message-agent {
            text-align: left;
        }
        .message-agent .bubble {
            background: #0f1a2a;
            color: #a8d4ff;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 24px 24px 24px 4px;
            max-width: 80%;
        }
        .message-time {
            font-size: 0.7rem;
            color: #5a8a5a;
            margin-top: 4px;
        }
        .log-panel {
            background: #0a0f0a;
            border: 2px solid #1f9f1f;
            border-radius: 20px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
        }
        .log-panel h3 {
            margin-bottom: 10px;
            color: #8eff8e;
        }
        .log-entry {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            padding: 4px 0;
            border-bottom: 1px solid #2a4a2a;
            color: #b3ffb3;
        }
        .log-time {
            color: #5a8a5a;
        }
        .log-info { color: #8eff8e; }
        .log-success { color: #a8ffa8; }
        .log-error { color: #ff9494; }
        .log-ai { color: #a8d4ff; }
        .log-user { color: #c5ffc5; }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            background: #111;
            color: #0f0;
            border: 1px solid #2ea82e;
            cursor: pointer;
            font-weight: 600;
            border-radius: 40px;
            transition: all 0.15s ease;
            font-family: monospace;
            font-size: 14px;
        }
        button:hover:not(:disabled) {
            background: #0f0;
            color: #0a0a0a;
            box-shadow: 0 0 12px #0f0;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button.recording {
            background: #f00;
            color: #fff;
            border-color: #f00;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        input {
            padding: 12px 18px;
            background: #0f120f;
            color: #0f0;
            border: 1px solid #2f8f2f;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            flex: 1;
            min-width: 250px;
        }
        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f0;
        }
        .dot.listening {
            background: #0f0;
            animation: pulse 1s infinite;
        }
        .dot.speaking {
            background: #f0f;
            animation: pulse 0.5s infinite;
        }
        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .auth-section input {
            min-width: 180px;
        }
        #authStatus {
            background: #1a2a1a;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>
            🏄‍♂️ Surf AI — Voice Conversation
            <span class="status-badge" id="connectionStatus">⚪ Offline</span>
        </h1>
        
        <!-- Auth -->
        <div class="auth-section">
            <input type="email" id="email" placeholder="Email" value="surf@testuser.com">
            <input type="password" id="password" placeholder="Password" value="Test1234!">
            <button id="signInBtn">🔐 Sign In</button>
            <button id="signOutBtn">🚪 Sign Out</button>
            <span id="authStatus">Not signed in</span>
        </div>
        
        <div class="conversation-container">
            <!-- Chat Panel -->
            <div class="chat-panel">
                <h3 style="margin-bottom: 15px; color: #8eff8e;">💬 Conversation</h3>
                <div class="chat-messages" id="chatMessages">
                    <div class="message message-agent">
                        <div class="bubble">Hi! I'm Surf AI. Click "Start Talking" and speak to me!</div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
                <div class="controls">
                    <button id="talkBtn">🎤 Start Talking</button>
                    <button id="stopBtn" disabled>⏹️ Stop</button>
                    <div class="voice-indicator">
                        <span class="dot" id="voiceDot"></span>
                        <span id="voiceStatus">Ready</span>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <input type="text" id="textInput" placeholder="Or type a message...">
                    <button id="sendTextBtn" style="margin-left: 10px;">📤 Send</button>
                </div>
            </div>
            
            <!-- Log Panel -->
            <div class="log-panel">
                <h3>📋 Live Logs</h3>
                <div id="logContainer"></div>
            </div>
        </div>
    </div>

    <script type="module">
        // Import LiveKit ESM
        import { Room, RoomEvent, LocalAudioTrack, createLocalAudioTrack, RemoteAudioTrack } from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';
        
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        // State
        let liveKitRoom = null;
        let liveKitToken = null;
        let localAudioTrack = null;
        let isRecording = false;
        let audioContext = null;
        let mediaStream = null;
        let mediaRecorder = null;
        let audioChunks = [];
        
        // UI Elements
        const talkBtn = document.getElementById('talkBtn');
        const stopBtn = document.getElementById('stopBtn');
        const voiceDot = document.getElementById('voiceDot');
        const voiceStatus = document.getElementById('voiceStatus');
        const connectionStatus = document.getElementById('connectionStatus');
        const chatMessages = document.getElementById('chatMessages');
        const logContainer = document.getElementById('logContainer');
        
        // Logging
        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${type}]`, msg);
        }
        
        // Chat
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message message-${sender}`;
            msgDiv.innerHTML = `
                <div class="bubble">${text}</div>
                <div class="message-time">${new Date().toLocaleTimeString()}</div>
            `;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Auth
        async function getAuthHeader() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return null;
            return { 'Authorization': `Bearer ${session.access_token}` };
        }
        
        document.getElementById('signInBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                addLog(`Sign in failed: ${error.message}`, 'error');
            } else {
                addLog(`✅ Signed in as ${data.user.email}`, 'success');
                document.getElementById('authStatus').textContent = `✅ ${data.user.email}`;
                // Auto-connect
                await connectToLiveKit();
            }
        };
        
        document.getElementById('signOutBtn').onclick = async () => {
            await supabaseClient.auth.signOut();
            addLog('Signed out', 'success');
            document.getElementById('authStatus').textContent = 'Not signed in';
            if (liveKitRoom) {
                liveKitRoom.disconnect();
                liveKitRoom = null;
            }
            connectionStatus.textContent = '⚪ Offline';
            connectionStatus.style.background = '#3a1f1f';
        };
        
        // Connect to LiveKit
        async function connectToLiveKit() {
            try {
                addLog('Getting LiveKit token...', 'info');
                const headers = await getAuthHeader();
                if (!headers) throw new Error('Not authenticated');
                
                const r = await fetch(`${GATEWAY}/livekit/token`, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: 'voice-conversation' })
                });
                const data = await r.json();
                liveKitToken = data.token;
                addLog('✅ Token obtained', 'success');
                
                addLog('Connecting to LiveKit...', 'info');
                liveKitRoom = new Room();
                
                liveKitRoom.on(RoomEvent.Connected, () => {
                    addLog('✅ Connected to LiveKit room', 'success');
                    connectionStatus.textContent = '🟢 Connected';
                    connectionStatus.style.background = '#1f3a1f';
                    voiceStatus.textContent = 'Ready - Click Start Talking';
                });
                
                liveKitRoom.on(RoomEvent.Disconnected, () => {
                    addLog('Disconnected from LiveKit', 'info');
                    connectionStatus.textContent = '⚪ Offline';
                    connectionStatus.style.background = '#3a1f1f';
                });
                
                liveKitRoom.on(RoomEvent.ParticipantConnected, (p) => {
                    addLog(`👤 ${p.identity} joined the room`, 'info');
                });
                
                // Listen for agent's audio response
                liveKitRoom.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                    if (track instanceof RemoteAudioTrack) {
                        addLog(`🎤 Agent audio from ${participant.identity}`, 'success');
                        voiceDot.className = 'dot speaking';
                        voiceStatus.textContent = 'Agent speaking...';
                        
                        // Auto-play agent audio
                        const audioElement = new Audio();
                        track.attach(audioElement);
                        audioElement.play();
                        
                        audioElement.onended = () => {
                            voiceDot.className = 'dot';
                            voiceStatus.textContent = 'Ready';
                        };
                    }
                });
                
                await liveKitRoom.connect('wss://surf-ai-k6d840vq.livekit.cloud', liveKitToken);
                addLog(`✅ Room joined: ${liveKitRoom.name}`, 'success');
                
                // Publish microphone
                addLog('Publishing microphone...', 'info');
                localAudioTrack = await createLocalAudioTrack();
                await liveKitRoom.localParticipant.publishTrack(localAudioTrack);
                addLog('🎤 Microphone ready!', 'success');
                
                talkBtn.disabled = false;
                
            } catch (err) {
                addLog(`Connection error: ${err.message}`, 'error');
                connectionStatus.textContent = '❌ Failed';
            }
        }
        
        // Start talking (continuous conversation)
        talkBtn.onclick = async () => {
            if (!liveKitRoom) {
                addLog('Not connected - signing in...', 'info');
                await document.getElementById('signInBtn').click();
                await new Promise(r => setTimeout(r, 2000));
            }
            
            if (!localAudioTrack) {
                addLog('Microphone not ready', 'error');
                return;
            }
            
            isRecording = true;
            talkBtn.disabled = true;
            stopBtn.disabled = false;
            talkBtn.classList.add('recording');
            voiceDot.className = 'dot listening';
            voiceStatus.textContent = '🎤 Listening... Speak now!';
            
            addLog('🎤 Listening mode active - speak your question', 'success');
        };
        
        stopBtn.onclick = () => {
            isRecording = false;
            talkBtn.disabled = false;
            stopBtn.disabled = true;
            talkBtn.classList.remove('recording');
            voiceDot.className = 'dot';
            voiceStatus.textContent = 'Processing...';
            addLog('⏹️ Stopped listening', 'info');
        };
        
        // Text fallback
        document.getElementById('sendTextBtn').onclick = async () => {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            addLog(`💬 You: ${text}`, 'user');
            document.getElementById('textInput').value = '';
            
            const headers = await getAuthHeader();
            if (!headers) {
                addLog('Sign in first', 'error');
                return;
            }
            
            try {
                addLog('Getting AI response...', 'info');
                const r = await fetch(`${GATEWAY}/ai/chat`, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: [{ role: 'user', content: text }] })
                });
                const data = await r.json();
                const reply = data.result || data.response || 'No response';
                
                addMessage(reply, 'agent');
                addLog(`🤖 AI: ${reply.slice(0, 100)}...`, 'ai');
                
                // Also speak via TTS
                const ttsR = await fetch(`${GATEWAY}/tts`, {
                    method: 'POST',
                    headers: { ...headers },
                    body: (() => {
                        const fd = new FormData();
                        fd.append('text', reply);
                        fd.append('voice', 'en-US-JennyNeural');
                        return fd;
                    })()
                });
                
                if (ttsR.ok) {
                    const blob = await ttsR.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    audio.play();
                }
            } catch (err) {
                addLog(`Chat error: ${err.message}`, 'error');
            }
        };
        
        // Check session on load
        (async () => {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                addLog(`Session restored: ${data.session.user.email}`, 'success');
                document.getElementById('authStatus').textContent = `✅ ${data.session.user.email}`;
                await connectToLiveKit();
            } else {
                addLog('👋 Not signed in. Sign in to start.', 'info');
            }
            addLog('✅ Voice conversation ready!', 'success');
        })();
    </script>
</body>
</html>
