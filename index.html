<!DOCTYPE html>
<html>
<head>
    <title>Surf Test with TURN</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 20px; }
        button { background: #1a1a1a; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:disabled { opacity: 0.3; }
        .log { background: #000; padding: 15px; margin-top: 20px; height: 400px; overflow-y: auto; }
    </style>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>
<body>
    <h1>🌊 Surf Test with TURN</h1>
    
    <div>
        <button id="connectBtn" onclick="doConnect()">1️⃣ Connect Gateway</button>
        <button id="agentBtn" onclick="doRequestAgent()" disabled>2️⃣ Request Agent</button>
        <button id="micBtn" onclick="doStartMic()" disabled>3️⃣ Start Mic</button>
    </div>
    
    <div class="log" id="log">Ready...</div>

    <script>
        const GATEWAY = 'https://surf-gateway.onrender.com';
        let socket, pc, stream, agentId;
        
        function log(msg, color = '#0f0') {
            const div = document.getElementById('log');
            div.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }
        
        window.doConnect = function() {
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            
            socket = io(GATEWAY, { transports: ['websocket'] });
            
            socket.on('connect', () => {
                log('✅ Gateway connected', '#0f0');
                document.getElementById('agentBtn').disabled = false;
                btn.textContent = '✅ Connected';
            });
            
            socket.on('connect_error', (e) => log('❌ ' + e.message, '#f00'));
            
            socket.on('agent_ready', (d) => { 
                agentId = d.agent_id; 
                log('🤖 Agent paired: ' + agentId.slice(0,8), '#0ff); 
                document.getElementById('micBtn').disabled = false; 
            });
            
            socket.on('answer', async (d) => { 
                log('📥 Got answer', '#0f0'); 
                await pc.setRemoteDescription(d); 
            });
        };
        
        window.doRequestAgent = function() {
            const btn = document.getElementById('agentBtn');
            btn.disabled = true;
            btn.textContent = 'Requesting...';
            
            socket.emit('request_agent', (r) => {
                if (r.success) {
                    agentId = r.agent_id;
                    log('✅ Agent assigned: ' + agentId.slice(0,8), '#0f0');
                    document.getElementById('micBtn').disabled = false;
                    btn.textContent = '✅ Agent Ready';
                } else {
                    log('⏳ ' + r.message, '#ff0');
                    btn.disabled = false;
                    btn.textContent = '2️⃣ Request Agent';
                }
            });
        };
        
        window.doStartMic = async function() {
            const btn = document.getElementById('micBtn');
            btn.disabled = true;
            
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            log('🎤 Mic ready', '#0f0');
            
            pc = new RTCPeerConnection({ 
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { 
                        urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443'],
                        username: 'openrelayproject',
                        credential: 'openrelayproject'
                    }
                ] 
            });
            
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            
            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('ice_candidate', { 
                        from: 'browser', 
                        agent_id: agentId, 
                        candidate: e.candidate 
                    });
                }
            };
            
            pc.onconnectionstatechange = () => {
                const state = pc.connectionState;
                log('WebRTC: ' + state, state === 'connected' ? '#0ff' : '#ff0');
                if (state === 'connected') {
                    log('🎉🎉🎉 REAL-TIME AUDIO FLOWING! 🎉🎉🎉', '#0ff');
                }
            };
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            socket.emit('offer', { agent_id: agentId, sdp: offer.sdp, type: offer.type });
            log('📤 Offer sent', '#0f0');
            btn.textContent = '🎤 Mic Active';
        };
    </script>
</body>
</html>
