<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Sandbox Test Page</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .test-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            min-height: calc(100vh - 60px);
        }
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .panel-header {
            font-weight: 700;
            font-size: 14px;
            color: var(--text);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        #chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .chat-msg {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
        }
        .chat-user {
            background: var(--accent-light);
            color: var(--text);
            margin-left: 20px;
        }
        .chat-ai {
            background: var(--bg-secondary);
            color: var(--text);
            margin-right: 20px;
        }
        .chat-system {
            background: transparent;
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
        }
        #chat-input {
            display: flex;
            gap: 8px;
        }
        #chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid var(--border-secondary);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            outline: none;
        }
        #chat-input input:focus {
            border-color: #0066FF;
        }
        #debug-log {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            background: #0F172A;
            border-radius: var(--radius-sm);
            padding: 12px;
            font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
            font-size: 10px;
            line-height: 1.6;
            color: #94A3B8;
        }
        .log-line {
            margin-bottom: 2px;
        }
        .log-in { color: #60A5FA; }
        .log-out { color: #34D399; }
        .log-error { color: #F87171; }
        .log-info { color: #94A3B8; }
        .btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            color: var(--text);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { border-color: var(--accent); }
        .btn-primary {
            background: var(--gradient);
            color: white;
            border: none;
        }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        select {
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 12px;
            background: var(--bg);
            color: var(--text);
        }
        #sandbox-iframe {
            display: none;
        }
        @media (max-width: 900px) {
            .test-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">
                <span class="gradient-text">Surf AI</span>
            </a>
            <span style="font-size:12px;color:var(--text-muted);">Sandbox Test Page</span>
            <div class="nav-links">
                <a href="about.html">About</a>
                <a href="docs.html">Docs</a>
                <label class="theme-switch">
                    <input type="checkbox" id="themeToggle">
                    <span class="theme-slider"></span>
                </label>
            </div>
        </div>
    </nav>

    <div class="test-container">
        <!-- Left: Chat + Controls -->
        <div class="panel">
            <div class="panel-header">💬 Chat</div>
            
            <div class="row" id="auth-section">
                <input type="email" id="login-email" placeholder="Email" value="surf@testuser.com" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
                <input type="password" id="login-password" placeholder="Password" value="Test1234!" style="flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:12px;">
                <button class="btn btn-primary" onclick="login()">Login</button>
            </div>
            
            <div id="session-status" style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                Status: Not connected
            </div>
            
            <div id="chat-messages"></div>
            
            <div id="chat-input">
                <input type="text" id="message-input" placeholder="Type a message..." disabled onkeypress="if(event.key==='Enter')sendText()">
                <button class="btn btn-primary" onclick="sendText()" id="send-btn" disabled>Send</button>
            </div>
            
            <div class="row" style="margin-top:8px;">
                <select id="model-select" onchange="setModel(this.value)">
                    <option value="">Model: Default</option>
                </select>
                <select id="voice-select" onchange="setVoice(this.value)">
                    <option value="">Voice: Default</option>
                </select>
                <select id="system-prompt" style="flex:1;">
                    <option value="assistant">Assistant</option>
                    <option value="browser">Browser</option>
                    <option value="workflow">Workflow</option>
                </select>
            </div>
            
            <div class="row" style="margin-top:4px;">
                <button class="btn btn-sm" onclick="startMic('ptt')">🎤 PTT</button>
                <button class="btn btn-sm" onclick="startMic('vad')">🔴 VAD</button>
                <button class="btn btn-sm" onclick="stopMic()">⏹ Stop Mic</button>
                <button class="btn btn-sm" onclick="getStatus()">📊 Status</button>
                <button class="btn btn-sm" onclick="getNotes()">📝 Notes</button>
            </div>
        </div>
        
        <!-- Right: Debug -->
        <div class="panel">
            <div class="panel-header">🔍 Debug Log</div>
            <div id="debug-log"></div>
            <button class="btn btn-sm" style="margin-top:8px;" onclick="document.getElementById('debug-log').innerHTML=''">Clear</button>
        </div>
    </div>

    <iframe id="sandbox-iframe" src="https://sb-sf.vercel.app/" allow="microphone; autoplay"></iframe>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/test-page.js"></script>
</body>
</html>
