<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — LIVEKIT FIXED</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: monospace; 
            background: #0b0e0b; 
            color: #cfc; 
            padding: 24px;
        }
        button { 
            margin: 5px; 
            padding: 8px 16px; 
            background: #111; 
            color: #0f0; 
            border: 1px solid #2ea82e; 
            cursor: pointer;
            border-radius: 40px;
        }
        button:hover { background: #0f0; color: #0a0a0a; }
        input, select { 
            padding: 8px 14px; 
            background: #0f120f; 
            color: #0f0; 
            border: 1px solid #2f8f2f; 
            border-radius: 28px;
        }
        pre { 
            background: #0c100c; 
            padding: 14px; 
            border: 1px solid #2a6a2a; 
            max-height: 200px; 
            overflow: auto; 
            border-radius: 14px;
        }
        .section { 
            border: 1px solid #2f8f2f; 
            padding: 20px; 
            margin: 20px 0; 
            border-radius: 28px;
        }
        #logContainer { 
            background: #0a0f0a; 
            border: 2px solid #1f9f1f; 
            padding: 12px; 
            max-height: 300px; 
            overflow-y: auto; 
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .log-line { border-bottom: 1px solid #2a4a2a; padding: 4px; }
        .error { color: #ff9494; }
        .success { color: #a8ffa8; }
        .info { color: #b3ffb3; }
        .success-badge {
            background: #1f3a1f;
            color: #8eff8e;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>🏄‍♂️ Surf AI — LIVEKIT FIXED <span class="success-badge">ESM Module</span></h1>
    
    <div id="logContainer"></div>
    
    <div class="section">
        <h3>🔐 Authentication</h3>
        <input type="email" id="email" value="surf@testuser.com">
        <input type="password" id="password" value="Test1234!">
        <button id="signInBtn">Sign In</button>
        <button id="signOutBtn">Sign Out</button>
        <span id="authStatus">Not signed in</span>
    </div>
    
    <div class="section">
        <h3>🎙️ LiveKit Connection</h3>
        <button id="getTokenBtn">Get Token</button>
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn">Disconnect</button>
        <pre id="roomStatus">Not connected</pre>
    </div>
    
    <div class="section">
        <h3>💬 Chat</h3>
        <input type="text" id="chatMsg" size="50" value="What makes Surf AI unique?">
        <button id="chatBtn">Send</button>
        <pre id="chatResult"></pre>
    </div>

    <script type="module">
        // ✅ Import LiveKit as ESM module - most reliable
        import { Room, RoomEvent, LocalAudioTrack, createLocalAudioTrack } from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';
        
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let liveKitRoom = null;
        let liveKitToken = null;
        
        function addLog(msg, type='info') {
            const container = document.getElementById('logContainer');
            const div = document.createElement('div');
            div.className = `log-line ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        async function getAuthHeader() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return null;
            return { 'Authorization': `Bearer ${session.access_token}` };
        }
        
        // Sign In
        document.getElementById('signInBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                addLog(`Sign in failed: ${error.message}`, 'error');
            } else {
                addLog(`Signed in as ${data.user.email}`, 'success');
                document.getElementById('authStatus').textContent = `✅ ${data.user.email}`;
            }
        };
        
        document.getElementById('signOutBtn').onclick = async () => {
            await supabaseClient.auth.signOut();
            addLog('Signed out', 'success');
            document.getElementById('authStatus').textContent = 'Not signed in';
        };
        
        // Get Token
        document.getElementById('getTokenBtn').onclick = async () => {
            const headers = await getAuthHeader();
            if (!headers) { addLog('Sign in first', 'error'); return; }
            const r = await fetch(`${GATEWAY}/livekit/token`, {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({ room: 'browser-test' })
            });
            const data = await r.json();
            liveKitToken = data.token;
            addLog('✅ Token obtained!', 'success');
            document.getElementById('roomStatus').textContent = 'Token ready';
        };
        
        // ✅ CONNECT - Using imported ESM modules
        document.getElementById('connectBtn').onclick = async () => {
            if (!liveKitToken) {
                addLog('Get token first', 'error');
                return;
            }
            try {
                addLog('Connecting to LiveKit...', 'info');
                
                liveKitRoom = new Room();
                
                liveKitRoom.on(RoomEvent.Connected, () => {
                    addLog('✅ Connected to LiveKit!', 'success');
                    document.getElementById('roomStatus').textContent = '✅ Connected';
                });
                
                liveKitRoom.on(RoomEvent.Disconnected, () => {
                    addLog('Disconnected', 'info');
                    document.getElementById('roomStatus').textContent = 'Disconnected';
                });
                
                liveKitRoom.on(RoomEvent.ParticipantConnected, (p) => {
                    addLog(`👤 ${p.identity} joined`, 'info');
                });
                
                await liveKitRoom.connect('wss://surf-ai-k6d840vq.livekit.cloud', liveKitToken);
                
                // Publish microphone
                addLog('Publishing microphone...', 'info');
                const track = await createLocalAudioTrack();
                await liveKitRoom.localParticipant.publishTrack(track);
                addLog('🎤 Microphone published! Agent can hear you.', 'success');
                document.getElementById('roomStatus').textContent = '🎙️ Connected + streaming';
                
            } catch (err) {
                addLog(`LiveKit error: ${err.message}`, 'error');
                document.getElementById('roomStatus').textContent = `Error: ${err.message}`;
            }
        };
        
        document.getElementById('disconnectBtn').onclick = () => {
            if (liveKitRoom) {
                liveKitRoom.disconnect();
                liveKitRoom = null;
                addLog('Disconnected', 'info');
                document.getElementById('roomStatus').textContent = 'Disconnected';
            }
        };
        
        // Chat
        document.getElementById('chatBtn').onclick = async () => {
            const headers = await getAuthHeader();
            if (!headers) { addLog('Sign in first', 'error'); return; }
            const msg = document.getElementById('chatMsg').value;
            const r = await fetch(`${GATEWAY}/ai/chat`, {
                method: 'POST',
                headers: { ...headers, 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: [{ role: 'user', content: msg }] })
            });
            const data = await r.json();
            const reply = data.result || data.response || 'No response';
            document.getElementById('chatResult').innerHTML = reply;
            addLog(`AI responded`, 'success');
        };
        
        // Check session
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) {
            addLog(`Session: ${data.session.user.email}`, 'success');
            document.getElementById('authStatus').textContent = `✅ ${data.session.user.email}`;
        }
        
        addLog('✅ Ready! ESM modules loaded.', 'success');
    </script>
</body>
</html>
