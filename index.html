<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Voice Conversation (FIXED)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', 'Fira Code', monospace;
            background: linear-gradient(135deg, #0a0f0a 0%, #0c120c 100%);
            color: #cfc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }
        h1 {
            font-size: 2rem;
            border-left: 5px solid #0f0;
            padding-left: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .status-badge {
            background: #1f3a1f;
            color: #8eff8e;
            padding: 5px 15px;
            border-radius: 40px;
            font-size: 0.9rem;
        }
        .conversation-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 20px;
        }
        .chat-panel {
            background: #0c100c;
            border: 1px solid #2f8f2f;
            border-radius: 28px;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            max-height: 400px;
            padding-right: 10px;
        }
        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-user {
            text-align: right;
        }
        .message-user .bubble {
            background: #1a3a1a;
            color: #a8ffa8;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 24px 24px 4px 24px;
            max-width: 80%;
        }
        .message-agent {
            text-align: left;
        }
        .message-agent .bubble {
            background: #0f1a2a;
            color: #a8d4ff;
            display: inline-block;
            padding: 12px 18px;
            border-radius: 24px 24px 24px 4px;
            max-width: 80%;
        }
        .message-time {
            font-size: 0.7rem;
            color: #5a8a5a;
            margin-top: 4px;
        }
        .log-panel {
            background: #0a0f0a;
            border: 2px solid #1f9f1f;
            border-radius: 20px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
        }
        .log-panel h3 {
            margin-bottom: 10px;
            color: #8eff8e;
        }
        .log-entry {
            font-family: 'Fira Code', monospace;
            font-size: 11px;
            padding: 4px 0;
            border-bottom: 1px solid #2a4a2a;
            color: #b3ffb3;
        }
        .log-time { color: #5a8a5a; }
        .log-info { color: #8eff8e; }
        .log-success { color: #a8ffa8; }
        .log-error { color: #ff9494; }
        .log-ai { color: #a8d4ff; }
        .log-user { color: #c5ffc5; }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            background: #111;
            color: #0f0;
            border: 1px solid #2ea82e;
            cursor: pointer;
            font-weight: 600;
            border-radius: 40px;
            transition: all 0.15s ease;
            font-family: monospace;
            font-size: 14px;
        }
        button:hover:not(:disabled) {
            background: #0f0;
            color: #0a0a0a;
            box-shadow: 0 0 12px #0f0;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        button.recording {
            background: #f00;
            color: #fff;
            border-color: #f00;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        input {
            padding: 12px 18px;
            background: #0f120f;
            color: #0f0;
            border: 1px solid #2f8f2f;
            border-radius: 40px;
            font-family: monospace;
            font-size: 14px;
            flex: 1;
            min-width: 250px;
        }
        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0f0;
        }
        .dot.listening {
            background: #0f0;
            animation: pulse 1s infinite;
        }
        .dot.speaking {
            background: #f0f;
            animation: pulse 0.5s infinite;
        }
        .auth-section {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .auth-section input {
            min-width: 180px;
        }
        #authStatus {
            background: #1a2a1a;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
        }
        audio {
            display: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <h1>
            🏄‍♂️ Surf AI — Voice Conversation
            <span class="status-badge" id="connectionStatus">⚪ Offline</span>
        </h1>
        
        <!-- Auth -->
        <div class="auth-section">
            <input type="email" id="email" placeholder="Email" value="surf@testuser.com">
            <input type="password" id="password" placeholder="Password" value="Test1234!">
            <button id="signInBtn">🔐 Sign In</button>
            <button id="signOutBtn">🚪 Sign Out</button>
            <span id="authStatus">Not signed in</span>
        </div>
        
        <div class="conversation-container">
            <!-- Chat Panel -->
            <div class="chat-panel">
                <h3 style="margin-bottom: 15px; color: #8eff8e;">💬 Conversation</h3>
                <div class="chat-messages" id="chatMessages">
                    <div class="message message-agent">
                        <div class="bubble">Hi! I'm Surf AI. Click "Start Talking" and speak to me!</div>
                        <div class="message-time">Just now</div>
                    </div>
                </div>
                <div class="controls">
                    <button id="talkBtn">🎤 Start Talking</button>
                    <button id="stopBtn" disabled>⏹️ Stop</button>
                    <div class="voice-indicator">
                        <span class="dot" id="voiceDot"></span>
                        <span id="voiceStatus">Ready</span>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <input type="text" id="textInput" placeholder="Or type a message...">
                    <button id="sendTextBtn" style="margin-left: 10px;">📤 Send</button>
                </div>
                <audio id="ttsAudio"></audio>
            </div>
            
            <!-- Log Panel -->
            <div class="log-panel">
                <h3>📋 Live Logs</h3>
                <div id="logContainer"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { Room, RoomEvent, LocalAudioTrack, createLocalAudioTrack, RemoteAudioTrack } from 'https://cdn.jsdelivr.net/npm/livekit-client@2/+esm';
        
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let liveKitRoom = null;
        let liveKitToken = null;
        let localAudioTrack = null;
        let isRecording = false;
        
        const talkBtn = document.getElementById('talkBtn');
        const stopBtn = document.getElementById('stopBtn');
        const voiceDot = document.getElementById('voiceDot');
        const voiceStatus = document.getElementById('voiceStatus');
        const connectionStatus = document.getElementById('connectionStatus');
        const chatMessages = document.getElementById('chatMessages');
        const logContainer = document.getElementById('logContainer');
        const ttsAudio = document.getElementById('ttsAudio');
        
        // Audio recording for transcription
        let mediaRecorder = null;
        let audioChunks = [];
        let audioStream = null;
        
        function addLog(msg, type = 'info') {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${msg}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${type}]`, msg);
        }
        
        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message message-${sender}`;
            msgDiv.innerHTML = `
                <div class="bubble">${text}</div>
                <div class="message-time">${new Date().toLocaleTimeString()}</div>
            `;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function getAuthHeader() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return null;
            return { 'Authorization': `Bearer ${session.access_token}` };
        }
        
        // ✅ FIXED: AI Chat with proper request format
        async function getAIResponse(message) {
            const headers = await getAuthHeader();
            if (!headers) throw new Error('Not authenticated');
            
            addLog(`Sending to AI: "${message}"`, 'info');
            
            const r = await fetch(`${GATEWAY}/ai/chat`, {
                method: 'POST',
                headers: { 
                    ...headers, 
                    'Content-Type': 'application/json',
                    'x-pin': 'ndu2026'  // Fallback PIN if auth fails
                },
                body: JSON.stringify({ 
                    messages: [{ role: 'user', content: message }],
                    sessionToken: 'voice-chat-' + Date.now()
                })
            });
            
            const data = await r.json();
            addLog(`AI raw response: ${JSON.stringify(data).slice(0, 200)}`, 'info');
            
            // Handle different response formats
            let reply = data.result || data.response || data.message || data.content;
            if (!reply && data.choices && data.choices[0]) {
                reply = data.choices[0].message?.content;
            }
            if (!reply && data.error) {
                throw new Error(data.error);
            }
            
            return reply || "I heard you, but I'm not sure how to respond.";
        }
        
        // ✅ FIXED: TTS with proper FormData
        async function speakText(text) {
            const headers = await getAuthHeader();
            if (!headers) return;
            
            const formData = new FormData();
            formData.append('text', text);
            formData.append('voice', 'en-US-JennyNeural');
            
            try {
                const r = await fetch(`${GATEWAY}/tts`, {
                    method: 'POST',
                    headers: { 'Authorization': headers.Authorization },
                    body: formData
                });
                
                if (r.ok) {
                    const blob = await r.blob();
                    ttsAudio.src = URL.createObjectURL(blob);
                    ttsAudio.play();
                    addLog('🔊 Speaking response...', 'success');
                } else {
                    addLog(`TTS error: HTTP ${r.status}`, 'error');
                }
            } catch (err) {
                addLog(`TTS failed: ${err.message}`, 'error');
            }
        }
        
        // ✅ FIXED: Transcription using gateway
        async function transcribeAudio(audioBlob) {
            const headers = await getAuthHeader();
            if (!headers) throw new Error('Not authenticated');
            
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.webm');
            
            addLog('Transcribing audio...', 'info');
            
            const r = await fetch(`${GATEWAY}/transcribe`, {
                method: 'POST',
                headers: { 'Authorization': headers.Authorization },
                body: formData
            });
            
            const data = await r.json();
            const transcript = data.text || data.transcript || data.result;
            
            if (!transcript) throw new Error('No transcript returned');
            
            return transcript;
        }
        
        // Start recording for transcription
        async function startRecording() {
            try {
                audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(audioStream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };
                
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    
                    try {
                        const transcript = await transcribeAudio(audioBlob);
                        addLog(`📝 Transcript: "${transcript}"`, 'success');
                        addMessage(transcript, 'user');
                        
                        const reply = await getAIResponse(transcript);
                        addMessage(reply, 'agent');
                        addLog(`🤖 AI: ${reply}`, 'ai');
                        
                        await speakText(reply);
                        
                    } catch (err) {
                        addLog(`Error: ${err.message}`, 'error');
                    }
                    
                    voiceDot.className = 'dot';
                    voiceStatus.textContent = 'Ready';
                    talkBtn.disabled = false;
                    stopBtn.disabled = true;
                    talkBtn.classList.remove('recording');
                };
                
                mediaRecorder.start();
                isRecording = true;
                
            } catch (err) {
                addLog(`Mic error: ${err.message}`, 'error');
            }
        }
        
        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                audioStream?.getTracks().forEach(t => t.stop());
            }
            isRecording = false;
        }
        
        document.getElementById('signInBtn').onclick = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                addLog(`Sign in failed: ${error.message}`, 'error');
            } else {
                addLog(`✅ Signed in as ${data.user.email}`, 'success');
                document.getElementById('authStatus').textContent = `✅ ${data.user.email}`;
                await connectToLiveKit();
            }
        };
        
        document.getElementById('signOutBtn').onclick = async () => {
            await supabaseClient.auth.signOut();
            addLog('Signed out', 'success');
            document.getElementById('authStatus').textContent = 'Not signed in';
            if (liveKitRoom) {
                liveKitRoom.disconnect();
                liveKitRoom = null;
            }
            connectionStatus.textContent = '⚪ Offline';
        };
        
        async function connectToLiveKit() {
            try {
                addLog('Getting LiveKit token...', 'info');
                const headers = await getAuthHeader();
                if (!headers) throw new Error('Not authenticated');
                
                const r = await fetch(`${GATEWAY}/livekit/token`, {
                    method: 'POST',
                    headers: { ...headers, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ room: 'voice-conversation' })
                });
                const data = await r.json();
                liveKitToken = data.token;
                addLog('✅ Token obtained', 'success');
                
                liveKitRoom = new Room();
                
                liveKitRoom.on(RoomEvent.Connected, () => {
                    addLog('✅ Connected to LiveKit', 'success');
                    connectionStatus.textContent = '🟢 Connected';
                    talkBtn.disabled = false;
                });
                
                liveKitRoom.on(RoomEvent.Disconnected, () => {
                    addLog('Disconnected from LiveKit', 'info');
                    connectionStatus.textContent = '⚪ Offline';
                });
                
                liveKitRoom.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                    if (track instanceof RemoteAudioTrack && participant.identity.includes('agent')) {
                        addLog(`🎤 Agent speaking...`, 'success');
                        voiceDot.className = 'dot speaking';
                        
                        const audioEl = new Audio();
                        track.attach(audioEl);
                        audioEl.play();
                        
                        audioEl.onended = () => {
                            voiceDot.className = 'dot';
                        };
                    }
                });
                
                await liveKitRoom.connect('wss://surf-ai-k6d840vq.livekit.cloud', liveKitToken);
                
                localAudioTrack = await createLocalAudioTrack();
                await liveKitRoom.localParticipant.publishTrack(localAudioTrack);
                addLog('🎤 Microphone ready', 'success');
                
            } catch (err) {
                addLog(`Connection error: ${err.message}`, 'error');
            }
        }
        
        talkBtn.onclick = async () => {
            if (!liveKitRoom) {
                addLog('Connecting...', 'info');
                await connectToLiveKit();
            }
            
            talkBtn.disabled = true;
            stopBtn.disabled = false;
            talkBtn.classList.add('recording');
            voiceDot.className = 'dot listening';
            voiceStatus.textContent = '🎤 Recording... Speak!';
            
            await startRecording();
            
            // Auto-stop after 5 seconds of silence (simplified)
            setTimeout(() => {
                if (isRecording) {
                    stopRecording();
                    addLog('⏹️ Auto-stopped', 'info');
                }
            }, 5000);
        };
        
        stopBtn.onclick = () => {
            stopRecording();
            addLog('⏹️ Stopped recording', 'info');
        };
        
        document.getElementById('sendTextBtn').onclick = async () => {
            const text = document.getElementById('textInput').value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            addLog(`💬 You: ${text}`, 'user');
            document.getElementById('textInput').value = '';
            
            try {
                const reply = await getAIResponse(text);
                addMessage(reply, 'agent');
                addLog(`🤖 AI: ${reply}`, 'ai');
                await speakText(reply);
            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
            }
        };
        
        // Init
        (async () => {
            const { data } = await supabaseClient.auth.getSession();
            if (data.session) {
                addLog(`Session restored: ${data.session.user.email}`, 'success');
                document.getElementById('authStatus').textContent = `✅ ${data.session.user.email}`;
                await connectToLiveKit();
            } else {
                addLog('👋 Sign in to start', 'info');
            }
            addLog('✅ Ready!', 'success');
        })();
    </script>
</body>
</html>
