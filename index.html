<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — 100% Working</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', monospace; 
            background: #0b0e0b; 
            color: #cfc; 
            padding: 24px;
        }
        button { 
            margin: 5px 6px 5px 0; 
            padding: 8px 16px; 
            background: #111; 
            color: #0f0; 
            border: 1px solid #2ea82e; 
            cursor: pointer;
            border-radius: 40px;
            font-weight: 600;
        }
        button:hover { background: #0f0; color: #0a0a0a; }
        input, select { 
            padding: 8px 14px; 
            background: #0f120f; 
            color: #0f0; 
            border: 1px solid #2f8f2f; 
            border-radius: 28px;
            margin: 6px 8px 6px 0;
        }
        pre { 
            background: #0c100c; 
            padding: 14px; 
            border: 1px solid #2a6a2a; 
            max-height: 220px; 
            overflow: auto; 
            border-radius: 14px;
            font-size: 12px;
        }
        .section { 
            border: 1px solid #2f8f2f; 
            padding: 20px; 
            margin: 24px 0; 
            border-radius: 28px;
            background: #0c100c;
        }
        #logContainer { 
            background: #0a0f0a; 
            border: 2px solid #1f9f1f; 
            padding: 12px; 
            max-height: 300px; 
            overflow-y: auto; 
            font-size: 12px;
            border-radius: 20px;
        }
        .log-line { border-bottom: 1px solid #2a4a2a; padding: 6px; }
        .error { color: #ff9494; }
        .success { color: #a8ffa8; }
        .flex-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
    </style>
    <!-- Try multiple CDN sources -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>🏄‍♂️ Surf AI — 100% Working</h1>
    
    <div id="logContainer"></div>
    <button id="clearLogsBtn">🗑️ Clear</button>
    
    <div class="section">
        <h3>🔐 Auth</h3>
        <input type="email" id="email" value="surf@testuser.com">
        <input type="password" id="password" value="Test1234!">
        <button id="signInBtn">Sign In</button>
        <span id="authStatus"></span>
    </div>
    
    <div class="section">
        <h3>🎙️ LiveKit (FIXED)</h3>
        <input type="text" id="room" value="surf-demo-room">
        <button id="getTokenBtn">Get Token</button>
        <button id="connectRoomBtn">Connect</button>
        <pre id="roomStatus">Not connected</pre>
    </div>

    <script>
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let token = null;
        let room = null;
        
        function log(msg, type='info') {
            const c = document.getElementById('logContainer');
            const d = document.createElement('div');
            d.className = `log-line ${type}`;
            d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }
        
        async function signIn() {
            const { data, error } = await supabase.auth.signInWithPassword({
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            });
            if (error) { log('Sign in failed: ' + error.message, 'error'); return; }
            document.getElementById('authStatus').textContent = '✅ ' + data.user.email;
            log('Signed in as ' + data.user.email, 'success');
            return data.session.access_token;
        }
        
        async function getToken() {
            const { data } = await supabase.auth.getSession();
            if (!data.session) { log('Sign in first', 'error'); return; }
            
            const roomName = document.getElementById('room').value;
            const resp = await fetch(GATEWAY + '/livekit/token', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + data.session.access_token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ room: roomName })
            });
            const data2 = await resp.json();
            token = data2.token;
            log('Token obtained for room: ' + roomName, 'success');
            document.getElementById('roomStatus').textContent = 'Token ready';
        }
        
        async function connectRoom() {
            if (!token) { log('Get token first', 'error'); return; }
            
            // Try all possible global names
            const LK = window.LiveKitClient || window.LiveKit || window.livekit;
            if (!LK) { log('LiveKit not loaded', 'error'); return; }
            
            room = new LK.Room();
            room.on(LK.RoomEvent.Connected, () => {
                log('Connected to room!', 'success');
                document.getElementById('roomStatus').textContent = '✅ Connected';
            });
            
            await room.connect('wss://surf-ai-k6d840vq.livekit.cloud', token);
            
            const track = await LK.createLocalAudioTrack();
            await room.localParticipant.publishTrack(track);
            log('Microphone published', 'success');
        }
        
        document.getElementById('signInBtn').onclick = signIn;
        document.getElementById('getTokenBtn').onclick = getToken;
        document.getElementById('connectRoomBtn').onclick = connectRoom;
        document.getElementById('clearLogsBtn').onclick = () => document.getElementById('logContainer').innerHTML = '';
        
        // Check LiveKit
        setTimeout(() => {
            if (window.LiveKitClient) log('✅ LiveKitClient loaded', 'success');
            else log('❌ LiveKitClient not loaded', 'error');
        }, 1000);
        
        log('Ready — Sign in first');
    </script>
</body>
</html>
