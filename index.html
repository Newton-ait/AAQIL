<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔧 Surf Voice - Socket.io Auth Debugger</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel {
            background: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid;
        }
        .success { border-left-color: #4ec9b0; }
        .error { border-left-color: #f48771; }
        .info { border-left-color: #569cd6; }
        .warning { border-left-color: #ce9178; }
        
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #1177bb; }
        button.danger { background: #a1260d; }
        button.success { background: #2d6a4f; }
        
        input, textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            border-radius: 4px;
            font-family: monospace;
        }
        
        .log {
            background: #1e1e1e;
            padding: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            border-radius: 4px;
        }
        
        .log-entry {
            padding: 4px;
            margin: 2px 0;
            border-bottom: 1px solid #333;
        }
        
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-left: 10px;
        }
        .status-good { background: #2d6a4f; }
        .status-bad { background: #a1260d; }
        .status-warn { background: #ce9178; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        pre {
            background: #1e1e1e;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Surf Voice - Socket.io Auth Debugger</h1>
        <p>Tests why <code>authenticate</code> event isn't reaching Gateway</p>
        
        <!-- Status Panel -->
        <div class="panel info" id="statusPanel">
            <strong>📊 Current Status</strong>
            <div id="statusDetails">
                <span id="tokenStatus">Checking token...</span><br>
                <span id="socketStatus">Checking socket...</span><br>
                <span id="authStatus">Auth not attempted</span>
            </div>
        </div>
        
        <div class="grid">
            <!-- Controls -->
            <div class="panel info">
                <strong>🎮 Controls</strong>
                <div>
                    <button onclick="loadSandbox()">🔄 Load Sandbox</button>
                    <button onclick="testAuth()">🔐 Test Auth & Send</button>
                    <button onclick="checkState()">🔍 Check State</button>
                    <button onclick="clearLogs()">🗑️ Clear Logs</button>
                </div>
                <div style="margin-top: 10px;">
                    <button onclick="manualAuth()" class="success">📤 Manually Send Auth</button>
                    <button onclick="testStartMic()">🎤 Test Start Mic</button>
                </div>
            </div>
            
            <!-- Configuration -->
            <div class="panel info">
                <strong>⚙️ Configuration</strong>
                <label>Gateway URL:</label>
                <input type="text" id="gatewayUrl" value="https://surf-gateway.onrender.com">
                <label>Sandbox URL:</label>
                <input type="text" id="sandboxUrl" value="https://ashirafnewton-ait.github.io/extension/">
                <button onclick="updateUrls()">Update URLs</button>
            </div>
        </div>
        
        <!-- Iframe -->
        <div class="panel info">
            <strong>🏄 Sandbox Iframe</strong>
            <iframe id="sandboxFrame" style="width:100%; height:400px; border:none; background:white;"></iframe>
        </div>
        
        <!-- Logs -->
        <div class="panel info">
            <strong>📝 Debug Logs</strong>
            <div class="log" id="logs"></div>
        </div>
        
        <!-- Test Scripts -->
        <div class="panel info">
            <strong>🧪 Test Scripts (Copy to Console)</strong>
            <pre id="testScripts"></pre>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <script>
        let sandboxFrame = null;
        let testSocket = null;
        
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry`;
            entry.style.color = type === 'error' ? '#f48771' : type === 'success' ? '#4ec9b0' : '#d4d4d4';
            entry.innerHTML = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
            addLog('Logs cleared', 'info');
        }
        
        function updateStatus(id, text, status = 'info') {
            const element = document.getElementById(id);
            if (element) element.innerHTML = text;
        }
        
        async function loadSandbox() {
            const sandboxUrl = document.getElementById('sandboxUrl').value;
            addLog(`Loading sandbox: ${sandboxUrl}`, 'info');
            
            sandboxFrame = document.getElementById('sandboxFrame');
            sandboxFrame.src = sandboxUrl;
            
            // Listen for messages from sandbox
            window.removeEventListener('message', handleSandboxMessage);
            window.addEventListener('message', handleSandboxMessage);
            
            sandboxFrame.onload = () => {
                addLog('✅ Sandbox iframe loaded', 'success');
                updateStatus('socketStatus', '🔄 Check socket connection...');
                setTimeout(() => checkState(), 2000);
            };
        }
        
        function handleSandboxMessage(event) {
            addLog(`📨 From sandbox: ${JSON.stringify(event.data).substring(0, 200)}`, 'info');
            
            if (event.data.type === 'sandbox_ready') {
                addLog('🏄 Sandbox ready!', 'success');
                updateStatus('socketStatus', '✅ Sandbox loaded');
            }
            
            if (event.data.type === 'auth_token') {
                addLog(`🔐 Received auth token from sandbox: ${event.data.token?.substring(0, 50)}...`, 'success');
                updateStatus('tokenStatus', `✅ Token received: ${event.data.token?.substring(0, 30)}...`);
                window.authToken = event.data.token;
            }
            
            if (event.data.type === 'log') {
                addLog(`[Sandbox] ${event.data.message}`, event.data.level);
            }
            
            if (event.data.type === 'status') {
                addLog(`📊 Sandbox status: ${event.data.text}`, 'info');
            }
        }
        
        async function testAuth() {
            addLog('🔐 Starting auth test...', 'info');
            
            // Get token from Supabase directly
            const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: 'surf@testuser.com',
                        password: 'Test1234!'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const token = data.access_token;
                    addLog(`✅ Got Supabase token: ${token.substring(0, 50)}...`, 'success');
                    updateStatus('tokenStatus', `✅ Token from Supabase: ${token.substring(0, 30)}...`);
                    window.authToken = token;
                    
                    // Send to sandbox
                    if (sandboxFrame && sandboxFrame.contentWindow) {
                        sandboxFrame.contentWindow.postMessage({
                            type: 'auth_token',
                            token: token
                        }, '*');
                        addLog('📤 Sent token to sandbox', 'success');
                    }
                    
                    // Also test direct socket connection
                    await testDirectSocket(token);
                } else {
                    addLog(`❌ Auth failed: ${response.status}`, 'error');
                }
            } catch(e) {
                addLog(`❌ Auth error: ${e.message}`, 'error');
            }
        }
        
        async function testDirectSocket(token) {
            const gatewayUrl = document.getElementById('gatewayUrl').value;
            addLog(`🔌 Testing direct socket.io connection to ${gatewayUrl}`, 'info');
            
            // Close existing socket
            if (testSocket) {
                testSocket.disconnect();
            }
            
            // Create new socket connection
            testSocket = io(gatewayUrl, {
                transports: ['websocket', 'polling'],
                reconnection: false,
                timeout: 5000
            });
            
            testSocket.on('connect', () => {
                addLog(`✅ Socket.io connected! ID: ${testSocket.id}`, 'success');
                updateStatus('socketStatus', `✅ Socket connected: ${testSocket.id}`);
                
                // Send authenticate event
                addLog(`📤 Sending 'authenticate' event with token...`, 'info');
                testSocket.emit('authenticate', { token: token });
            });
            
            testSocket.on('authenticated', (response) => {
                addLog(`✅ AUTHENTICATED! Response: ${JSON.stringify(response)}`, 'success');
                updateStatus('authStatus', `✅ Auth successful!`);
                
                if (response.success) {
                    addLog(`🎉 Gateway accepted token! Transport creation should work now`, 'success');
                } else {
                    addLog(`❌ Gateway rejected token: ${response.error}`, 'error');
                }
            });
            
            testSocket.on('connect_error', (error) => {
                addLog(`❌ Socket connection error: ${error.message}`, 'error');
                updateStatus('socketStatus', `❌ Connection failed: ${error.message}`);
            });
            
            testSocket.on('error', (error) => {
                addLog(`❌ Socket error: ${error}`, 'error');
            });
            
            // Listen for all events
            testSocket.onAny((event, ...args) => {
                addLog(`📨 Socket event '${event}': ${JSON.stringify(args).substring(0, 150)}`, 'info');
            });
            
            setTimeout(() => {
                if (testSocket && testSocket.connected) {
                    addLog('⏰ Test complete, disconnecting...', 'info');
                    testSocket.disconnect();
                }
            }, 10000);
        }
        
        function manualAuth() {
            if (testSocket && testSocket.connected && window.authToken) {
                addLog('📤 Manually sending authenticate event...', 'info');
                testSocket.emit('authenticate', { token: window.authToken });
            } else {
                addLog(`❌ Cannot send: socket connected=${testSocket?.connected}, token=${!!window.authToken}`, 'error');
            }
        }
        
        function testStartMic() {
            if (sandboxFrame && sandboxFrame.contentWindow) {
                addLog('🎤 Sending start_mic to sandbox', 'info');
                sandboxFrame.contentWindow.postMessage({ type: 'start_mic' }, '*');
            }
        }
        
        function checkState() {
            addLog('🔍 Checking current state...', 'info');
            updateStatus('tokenStatus', `Token: ${window.authToken ? '✅ Present' : '❌ Missing'}`);
            updateStatus('socketStatus', `Socket: ${testSocket?.connected ? '✅ Connected' : '❌ Disconnected'}`);
            
            if (sandboxFrame) {
                addLog('Sending ping to sandbox...', 'info');
                sandboxFrame.contentWindow.postMessage({ type: 'ping' }, '*');
            }
        }
        
        function updateUrls() {
            addLog('URLs updated, reloading sandbox...', 'info');
            loadSandbox();
        }
        
        // Generate test scripts for console
        function generateTestScripts() {
            const scripts = `// === TEST 1: Check Token ===
console.log('Token exists:', !!window.authToken);
console.log('Token preview:', window.authToken?.substring(0, 30));

// === TEST 2: Check Socket State ===
console.log('Socket exists:', !!window.socket);
console.log('Socket connected:', window.socket?.connected);
console.log('Socket ID:', window.socket?.id);

// === TEST 3: Manually Send Auth ===
if (window.socket?.connected && window.authToken) {
    console.log('Sending authenticate...');
    window.socket.emit('authenticate', { token: window.authToken });
} else {
    console.log('Cannot send: socket=', !!window.socket?.connected, 'token=', !!window.authToken);
}

// === TEST 4: Listen for Auth Response ===
window.socket?.on('authenticated', (response) => {
    console.log('Auth response:', response);
});

// === TEST 5: Monitor All Socket Events ===
window.socket?.onAny((event, ...args) => {
    console.log('Socket event:', event, args);
});`;
            
            document.getElementById('testScripts').innerText = scripts;
        }
        
        // Auto-load on page load
        window.addEventListener('load', () => {
            addLog('🌊 Surf Voice Auth Debugger Ready', 'success');
            generateTestScripts();
            setTimeout(() => loadSandbox(), 1000);
        });
    </script>
</body>
</html>
