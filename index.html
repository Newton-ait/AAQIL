<!DOCTYPE html>
<html>
<head>
    <title>Surf Test</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #0f0; padding: 20px; }
        button { background: #1a1a1a; color: #0f0; border: 1px solid #0f0; padding: 10px 20px; margin: 5px; cursor: pointer; }
        button:disabled { opacity: 0.3; }
        .log { background: #000; padding: 15px; margin-top: 20px; height: 300px; overflow-y: auto; }
    </style>
    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
</head>
<body>
    <h1>🌊 Surf Connection Test</h1>
    
    <div>
        <button id="connectBtn" onclick="connect()">1️⃣ Connect Gateway</button>
        <button id="agentBtn" onclick="requestAgent()" disabled>2️⃣ Request Agent</button>
        <button id="micBtn" onclick="startMic()" disabled>3️⃣ Start Mic</button>
    </div>
    
    <div class="log" id="log">Ready...</div>

    <script>
        const GATEWAY = 'https://surf-gateway.onrender.com';
        let socket, pc, stream, agentId;
        
        function log(msg, color = '#0f0') {
            const div = document.getElementById('log');
            div.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            div.scrollTop = div.scrollHeight;
        }
        
        async function connect() {
            const btn = document.getElementById('connectBtn');
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            
            socket = io(GATEWAY, { transports: ['websocket'] });
            
            socket.on('connect', () => {
                log('✅ Gateway connected', '#0f0');
                document.getElementById('agentBtn').disabled = false;
                btn.textContent = '✅ Connected';
            });
            
            socket.on('connect_error', (e) => log('❌ ' + e.message, '#f00'));
            socket.on('agent_ready', (d) => { agentId = d.agent_id; log('🤖 Agent paired', '#0ff'); document.getElementById('micBtn').disabled = false; });
            socket.on('agent_disconnected', () => log('⚠️ Agent gone', '#f80'));
            socket.on('answer', async (d) => { log('📥 Got answer', '#0f0'); await pc.setRemoteDescription(d); });
            socket.on('ice_candidate', async (d) => { if (d.candidate) await pc.addIceCandidate(d.candidate); });
        }
        
        function requestAgent() {
            document.getElementById('agentBtn').disabled = true;
            socket.emit('request_agent', (r) => {
                log(r.success ? '✅ Agent assigned' : '⏳ ' + r.message, '#ff0');
                if (!r.success) document.getElementById('agentBtn').disabled = false;
            });
        }
        
        async function startMic() {
            const btn = document.getElementById('micBtn');
            btn.disabled = true;
            
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            log('🎤 Mic ready', '#0f0');
            
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            
            pc.onconnectionstatechange = () => {
                log('State: ' + pc.connectionState, pc.connectionState === 'connected' ? '#0ff' : '#ff0');
                if (pc.connectionState === 'connected') log('🎉 REAL-TIME AUDIO FLOWING!', '#0ff');
            };
            
            pc.onicecandidate = (e) => { if (e.candidate) socket.emit('ice_candidate', { from: 'browser', agent_id: agentId, candidate: e.candidate }); };
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            socket.emit('offer', { agent_id: agentId, sdp: offer.sdp, type: offer.type });
            log('📤 Offer sent', '#0f0');
            
            btn.textContent = '🎤 Mic Active';
        }
    </script>
</body>
</html>
