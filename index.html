<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Sandbox Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --bg-card: #1E293B;
            --text: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border: rgba(59,130,246,0.1);
            --accent: #3B82F6;
            --green: #22C55E;
            --red: #EF4444;
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .gradient-text {
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-bar {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 4px;
        }
        .dot-green { background: var(--green); }
        .dot-red { background: var(--red); }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }
        .panel-header {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .full { grid-column: 1 / -1; }
        input, select, button {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent); }
        button {
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            color: white;
            border: none;
        }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        .chat-log {
            background: #0F172A;
            border-radius: var(--radius);
            padding: 12px;
            height: 300px;
            overflow-y: auto;
            font-size: 12px;
            font-family: 'Menlo', monospace;
            color: #94A3B8;
            line-height: 1.6;
        }
        .log-info { color: #94A3B8; }
        .log-in { color: #60A5FA; }
        .log-out { color: #34D399; }
        .log-error { color: #F87171; }
        .chat-msg { margin-bottom: 6px; }
        .chat-user { color: #60A5FA; }
        .chat-ai { color: #34D399; }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span class="gradient-text">🏄 Surf AI</span> Sandbox Test
        </h1>
        
        <div class="status-bar">
            <span><span class="status-dot dot-red" id="conn-dot"></span> <span id="conn-text">Disconnected</span></span>
            <span id="session-status">Session: —</span>
            <span id="msg-count">Messages: 0</span>
        </div>

        <div class="grid">
            <!-- Auth -->
            <div class="panel full">
                <div class="panel-header">🔐 Auth</div>
                <div class="row">
                    <input type="email" id="login-email" placeholder="Email" value="surf@testuser.com" style="flex:1;">
                    <input type="password" id="login-password" placeholder="Password" value="Test1234!" style="flex:1;">
                    <button class="btn-primary" onclick="login()">Login</button>
                    <span id="auth-status" style="font-size:12px;color:var(--text-muted);"></span>
                </div>
            </div>

            <!-- Chat -->
            <div class="panel">
                <div class="panel-header">💬 Chat</div>
                <div class="chat-log" id="chat-log"></div>
                <div class="row" style="margin-top:8px;">
                    <input type="text" id="message-input" placeholder="Type a message..." disabled style="flex:1;" onkeypress="if(event.key==='Enter')sendText()">
                    <button class="btn-primary" onclick="sendText()" id="send-btn" disabled>Send</button>
                </div>
            </div>

            <!-- Controls -->
            <div class="panel">
                <div class="panel-header">🎛️ Controls</div>
                <div class="row">
                    <select id="model-select"><option value="">Model: Default</option></select>
                    <select id="voice-select"><option value="">Voice: Default</option></select>
                </div>
                <div class="row">
                    <button onclick="startMic('ptt')">🎤 PTT</button>
                    <button onclick="startMic('vad')">🟢 VAD</button>
                    <button onclick="stopMic()">⏹ Stop</button>
                    <button class="btn-sm" onclick="getStatus()">📊</button>
                    <button class="btn-sm" onclick="newChat()">🔄 New</button>
                </div>
                <div class="row" style="margin-top:8px;">
                    <label style="font-size:12px;display:flex;align-items:center;gap:6px;">
                        <input type="checkbox" id="privacy-toggle" onchange="togglePrivacy()"> 🔒 Privacy Mode
                    </label>
                </div>
            </div>
        </div>
    </div>

    <iframe id="sandbox" src="https://sb-sf.vercel.app/" allow="microphone; autoplay" style="display:none;"></iframe>

    <script src="test.js"></script>
</body>
</html>
