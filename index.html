<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Voice & Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00ff9d; margin-bottom: 10px; }
        #status {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
            background: #333;
        }
        #status.connected { background: #00ff9d33; color: #00ff9d; }
        #status.recording { background: #ff444433; color: #ff4444; }

        #chat-box {
            width: 100%;
            max-width: 500px;
            height: 300px;
            overflow-y: auto;
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #333;
        }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 85%; }
        .msg.user { background: #00ff9d22; border: 1px solid #00ff9d44; margin-left: auto; }
        .msg.ai { background: #333; margin-right: auto; }
        .msg.system { text-align: center; font-size: 11px; color: #888; }
        .msg .time { font-size: 10px; color: #666; }

        #input-area {
            display: flex;
            width: 100%;
            max-width: 500px;
            gap: 8px;
            margin-bottom: 15px;
        }
        #text-input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #16213e;
            color: #fff;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }
        #send-btn { background: #00ff9d; color: #000; }
        #mic-btn { 
            background: #333; 
            color: #fff;
            width: 50px;
            font-size: 20px;
        }
        #mic-btn.recording { background: #ff4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        #voice-select {
            padding: 8px;
            border-radius: 6px;
            background: #16213e;
            color: #fff;
            border: 1px solid #444;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>🏄 Surf Voice</h1>
    <div id="status">Disconnected</div>

    <select id="voice-select">
        <option value="en-US-AriaNeural">🇺🇸 Aria (Female)</option>
        <option value="en-US-GuyNeural">🇺🇸 Guy (Male)</option>
        <option value="en-GB-SoniaNeural">🇬🇧 Sonia (Female)</option>
        <option value="en-GB-RyanNeural">🇬🇧 Ryan (Male)</option>
    </select>

    <div id="chat-box"></div>

    <div id="input-area">
        <button id="mic-btn" title="Hold to talk">🎤</button>
        <input id="text-input" placeholder="Type a message..." />
        <button id="send-btn">Send</button>
    </div>

    <script src="https://ljksgzttnufecxohwtwm.supabase.co/storage/v1/object/public/scripts/socket.io.min.js"></script>
    <script>
        // ═══════════════════════════════════
        // CONFIG
        // ═══════════════════════════════════
        const GATEWAY = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';

        // ═══════════════════════════════════
        // STATE
        // ═══════════════════════════════════
        let authToken = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // ═══════════════════════════════════
        // UI ELEMENTS
        // ═══════════════════════════════════
        const statusEl = document.getElementById('status');
        const chatBox = document.getElementById('chat-box');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const voiceSelect = document.getElementById('voice-select');

        // ═══════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════
        function log(text, type = 'system') {
            const time = new Date().toLocaleTimeString();
            chatBox.innerHTML += `<div class="msg ${type}"><span class="time">${time}</span><br>${text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function setStatus(text, cls = '') {
            statusEl.textContent = text;
            statusEl.className = cls;
        }

        // ═══════════════════════════════════
        // AUTH
        // ═══════════════════════════════════
        async function login(email, password) {
            try {
                const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': ANON_KEY
                    },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    authToken = data.access_token;
                    setStatus('Connected ✅', 'connected');
                    log('🔐 Logged in as ' + email);
                    return true;
                } else {
                    log('❌ Login failed: ' + (data.error_description || JSON.stringify(data)));
                    return false;
                }
            } catch (e) {
                log('❌ Login error: ' + e.message);
                return false;
            }
        }

        // ═══════════════════════════════════
        // TEXT CHAT
        // ═══════════════════════════════════
        async function sendText(text) {
            if (!authToken) { log('❌ Not logged in'); return; }
            if (!text.trim()) return;

            log(text, 'user');
            textInput.value = '';

            try {
                const res = await fetch(`${GATEWAY}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify({
                        text: text,
                        voice: voiceSelect.value
                    })
                });
                const data = await res.json();

                if (data.response) {
                    log('🤖 ' + data.response, 'ai');
                }
                if (data.audio_base64) {
                    playAudio(data.audio_base64);
                }
            } catch (e) {
                log('❌ Chat error: ' + e.message);
            }
        }

        // ═══════════════════════════════════
        // VOICE RECORDING
        // ═══════════════════════════════════
        async function startRecording() {
            if (!authToken) { log('❌ Login first'); return; }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) audioChunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    await sendAudio(blob);
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                micBtn.classList.add('recording');
                setStatus('🎤 Recording...', 'recording');
                log('🎤 Recording started...');
            } catch (e) {
                log('❌ Mic error: ' + e.message);
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                micBtn.classList.remove('recording');
                setStatus('Connected ✅', 'connected');
                log('🎤 Recording stopped');
            }
        }

        async function sendAudio(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'recording.webm');
            formData.append('voice', voiceSelect.value);

            try {
                const res = await fetch(`${GATEWAY}/voice`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${authToken}` },
                    body: formData
                });
                const data = await res.json();

                if (data.transcript) log('📝 ' + data.transcript, 'user');
                if (data.response) log('🤖 ' + data.response, 'ai');
                if (data.audio_base64) playAudio(data.audio_base64);
            } catch (e) {
                log('❌ Voice error: ' + e.message);
            }
        }

        // ═══════════════════════════════════
        // TTS PLAYBACK
        // ═══════════════════════════════════
        function playAudio(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const blob = new Blob([bytes], { type: 'audio/mp3' });
            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);
            audio.onended = () => URL.revokeObjectURL(url);
            audio.play();
        }

        // ═══════════════════════════════════
        // EVENTS
        // ═══════════════════════════════════
        sendBtn.onclick = () => sendText(textInput.value);
        textInput.onkeydown = (e) => { if (e.key === 'Enter') sendText(textInput.value); };

        micBtn.onmousedown = startRecording;
        micBtn.onmouseup = stopRecording;
        micBtn.onmouseleave = () => { if (isRecording) stopRecording(); };

        // ═══════════════════════════════════
        // START
        // ═══════════════════════════════════
        log('🏄 Surf Voice Client ready');
        login('surf@testuser.com', 'Test1234!');
    </script>
</body>
</html>
