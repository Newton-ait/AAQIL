<!DOCTYPE html>
<html>
<head>
    <title>Surf AI — Mic Test with Logs</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 20px; background: #1a1a2e; color: #eee; }
        button { padding: 12px 24px; margin: 10px; font-size: 16px; cursor: pointer; }
        #logs { background: #0a0a15; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; font-size: 12px; }
        .log { margin: 5px 0; border-bottom: 1px solid #333; padding: 3px 0; }
        .agent { color: #4ade80; }
        .user { color: #60a5fa; }
        .system { color: #fbbf24; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <h2>🎤 Surf AI — Real Microphone Test</h2>
    
    <div>
        <button id="connectBtn">🔌 Connect & Request Mic</button>
        <button id="disconnectBtn" disabled>⏹️ Disconnect</button>
        <button id="clearLogsBtn">🧹 Clear Logs</button>
    </div>
    
    <div>
        <p>Status: <span id="status">Disconnected</span></p>
        <p>Room: <span id="roomInfo">-</span></p>
    </div>
    
    <div id="logs"></div>

    <script type="module">
        import { Room, RoomEvent, Track, RemoteTrack, RemoteParticipant } from 'https://esm.sh/livekit-client@2.0.10';
        
        // Configuration
        const GATEWAY_URL = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        const EMAIL = 'surf@testuser.com';
        const PASSWORD = 'Test1234!';
        
        let room = null;
        let localAudioTrack = null;
        let audioContext = null;
        
        // Logging
        function log(message, type = 'system') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            const time = new Date().toLocaleTimeString();
            logEntry.textContent = `[${time}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }
        
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
            log(`Status: ${text}`, 'system');
        }
        
        // Auth & Token
        async function getToken() {
            log('Authenticating...', 'system');
            const auth = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: EMAIL, password: PASSWORD })
            });
            const { access_token } = await auth.json();
            
            const ROOM = `mic-test-${Date.now()}`;
            document.getElementById('roomInfo').textContent = ROOM;
            
            const tk = await fetch(`${GATEWAY_URL}/livekit/token`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ room: ROOM })
            });
            const data = await tk.json();
            log(`Token obtained for room: ${ROOM}`, 'system');
            return { token: data.token, url: data.url };
        }
        
        // Connect
        document.getElementById('connectBtn').onclick = async () => {
            try {
                updateStatus('Connecting...');
                const { token, url } = await getToken();
                
                room = new Room({
                    adaptiveStream: true,
                    dynacast: true,
                    audioCaptureDefaults: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
                
                // Room events
                room.on(RoomEvent.Connected, () => {
                    updateStatus('Connected');
                    log('✅ Connected to LiveKit', 'system');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                });
                
                room.on(RoomEvent.Disconnected, () => {
                    updateStatus('Disconnected');
                    log('❌ Disconnected from room', 'system');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                });
                
                // Participant events
                room.on(RoomEvent.ParticipantConnected, (p) => {
                    log(`👤 ${p.identity} joined`, p.identity.includes('agent') ? 'agent' : 'user');
                });
                
                room.on(RoomEvent.ParticipantDisconnected, (p) => {
                    log(`👋 ${p.identity} left`, 'system');
                });
                
                // Track events
                room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                    log(`🎵 Track subscribed: ${track.kind} from ${participant.identity}`, 
                        participant.identity.includes('agent') ? 'agent' : 'user');
                    
                    if (track.kind === 'audio' && participant.identity.includes('agent')) {
                        track.attach();
                        log('🔊 Agent audio attached — you should hear it!', 'agent');
                        
                        // Log audio stats
                        track.on('audioPlaybackStarted', () => log('▶️ Agent audio playback started', 'agent'));
                        track.on('audioPlaybackFailed', (e) => log(`❌ Audio playback failed: ${e}`, 'error'));
                    }
                });
                
                room.on(RoomEvent.TrackPublished, (pub, participant) => {
                    log(`📤 Track published: ${pub.kind} by ${participant.identity}`, 'system');
                });
                
                room.on(RoomEvent.TrackUnpublished, (pub, participant) => {
                    log(`📤 Track unpublished: ${pub.kind} by ${participant.identity}`, 'system');
                });
                
                // Data channel
                room.on(RoomEvent.DataReceived, (payload, participant) => {
                    try {
                        const data = new TextDecoder().decode(payload);
                        const json = JSON.parse(data);
                        if (json.type === 'transcript') {
                            log(`📝 ${json.speaker}: "${json.text}"`, json.speaker === 'agent' ? 'agent' : 'user');
                        }
                    } catch (e) {
                        log(`📨 Raw data from ${participant?.identity}: ${payload}`, 'system');
                    }
                });
                
                // Connect
                await room.connect(url, token);
                log(`📍 Connected to room: ${room.name}`, 'system');
                
                // Request microphone
                updateStatus('Requesting microphone...');
                localAudioTrack = await createLocalAudioTrack({
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                });
                
                await room.localParticipant.publishTrack(localAudioTrack);
                log('🎤 Microphone published — speak now!', 'user');
                updateStatus('Ready — Speak!');
                
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
                updateStatus('Error');
            }
        };
        
        // Disconnect
        document.getElementById('disconnectBtn').onclick = async () => {
            if (localAudioTrack) {
                localAudioTrack.stop();
                localAudioTrack = null;
            }
            if (room) {
                await room.disconnect();
                room = null;
            }
            updateStatus('Disconnected');
        };
        
        // Clear logs
        document.getElementById('clearLogsBtn').onclick = () => {
            document.getElementById('logs').innerHTML = '';
            log('Logs cleared', 'system');
        };
        
        // Helper to create audio track
        async function createLocalAudioTrack(options) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: options });
            const audioTrack = stream.getAudioTracks()[0];
            log(`🎙️ Microphone acquired: ${audioTrack.label}`, 'system');
            return audioTrack;
        }
        
        log('Page loaded — click Connect to start', 'system');
    </script>
</body>
</html>
