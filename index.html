<!DOCTYPE html>
<html>
<head>
    <title>Surf AI — Mic Test (Final)</title>
    <style>
        body { font-family: monospace; max-width: 800px; margin: 20px auto; padding: 20px; background: #1a1a2e; color: #eee; }
        button { padding: 12px 24px; margin: 10px; font-size: 16px; cursor: pointer; border: none; border-radius: 8px; }
        #connectBtn { background: #4ade80; color: #000; }
        #disconnectBtn { background: #ef4444; color: #fff; }
        #clearBtn { background: #3b82f6; color: #fff; }
        #logs { background: #0a0a15; padding: 15px; border-radius: 8px; height: 400px; overflow-y: auto; font-size: 12px; margin-top: 20px; }
        .log { margin: 5px 0; border-bottom: 1px solid #333; padding: 3px 0; }
        .agent { color: #4ade80; }
        .user { color: #60a5fa; }
        .system { color: #fbbf24; }
        .error { color: #ef4444; }
        .status { padding: 10px; background: #0a0a15; border-radius: 8px; margin: 10px 0; }
        #audioContainer { display: none; }
    </style>
</head>
<body>
    <h2>🎤 Surf AI — Microphone Test</h2>
    
    <div class="status">
        <p>Status: <span id="status">Disconnected</span></p>
        <p>Room: <span id="roomInfo">-</span></p>
        <p>User: <span id="userInfo">ghostfree@test.com</span></p>
    </div>
    
    <div>
        <button id="connectBtn">🔌 Connect & Request Mic</button>
        <button id="disconnectBtn" disabled>⏹️ Disconnect</button>
        <button id="clearBtn">🧹 Clear Logs</button>
        <button id="testAudioBtn" style="background:#a855f7;color:#fff;">🔊 Test Beep</button>
    </div>
    
    <div id="audioContainer"></div>
    <div id="logs"></div>

    <script type="module">
        import { Room, RoomEvent, createLocalAudioTrack } from 'https://esm.sh/livekit-client@2.0.10';
        
        // Configuration
        const GATEWAY_URL = 'https://surf-gateway.onrender.com';
        const SUPABASE_URL = 'https://ljksgzttnufecxohwtwm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxqa3NnenR0bnVmZWN4b2h3dHdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxOTc1NzQsImV4cCI6MjA5MTc3MzU3NH0.jSnVFEe6w-fUA39iD7o9BP0EygB7yejofuU4GUbK6Bk';
        const EMAIL = 'ghostfree@test.com';
        const PASSWORD = 'NoGhost123!';
        
        let room = null;
        let localAudioTrack = null;
        
        // Logging
        function log(message, type = 'system') {
            const logsDiv = document.getElementById('logs');
            const logEntry = document.createElement('div');
            logEntry.className = `log ${type}`;
            const time = new Date().toLocaleTimeString();
            logEntry.textContent = `[${time}] ${message}`;
            logsDiv.appendChild(logEntry);
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }
        
        function updateStatus(text) {
            document.getElementById('status').textContent = text;
            log(`Status: ${text}`, 'system');
        }
        
        // Auth & Token
        async function getToken() {
            log('Authenticating...', 'system');
            const auth = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: EMAIL, password: PASSWORD })
            });
            const { access_token } = await auth.json();
            
            const ROOM = `mic-test-${Date.now()}`;
            document.getElementById('roomInfo').textContent = ROOM;
            
            const tk = await fetch(`${GATEWAY_URL}/livekit/token`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${access_token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ room: ROOM })
            });
            const data = await tk.json();
            log(`Token obtained for room: ${ROOM}`, 'system');
            return { token: data.token, url: data.url };
        }
        
        // Test audio with Web Audio API (real beep)
        document.getElementById('testAudioBtn').onclick = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.value = 440;
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
                log('✅ Test beep played — speakers working!', 'system');
            } catch (e) {
                log(`❌ Audio error: ${e.message}`, 'error');
            }
        };
        
        // Connect
        document.getElementById('connectBtn').onclick = async () => {
            try {
                updateStatus('Connecting...');
                const { token, url } = await getToken();
                
                room = new Room({
                    adaptiveStream: true,
                    dynacast: true
                });
                
                room.on(RoomEvent.Connected, () => {
                    updateStatus('Connected');
                    log('✅ Connected to LiveKit', 'system');
                    document.getElementById('connectBtn').disabled = true;
                    document.getElementById('disconnectBtn').disabled = false;
                });
                
                room.on(RoomEvent.Disconnected, () => {
                    updateStatus('Disconnected');
                    log('❌ Disconnected', 'system');
                    document.getElementById('connectBtn').disabled = false;
                    document.getElementById('disconnectBtn').disabled = true;
                });
                
                room.on(RoomEvent.ParticipantConnected, (p) => {
                    log(`👤 ${p.identity} joined`, p.identity.includes('agent') ? 'agent' : 'user');
                });
                
                room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
                    log(`🎵 Track subscribed: ${track.kind} from ${participant.identity}`, 
                        participant.identity.includes('agent') ? 'agent' : 'user');
                    
                    if (track.kind === 'audio' && participant.identity.includes('agent')) {
                        const audioElement = track.attach();
                        audioElement.muted = false;
                        audioElement.volume = 1.0;
                        audioElement.style.display = 'none';
                        document.getElementById('audioContainer').appendChild(audioElement);
                        log('🔊 Agent audio attached — you should hear it!', 'agent');
                        
                        audioElement.play().then(() => {
                            log('▶️ Agent audio playback started', 'agent');
                        }).catch(e => {
                            log(`⚠️ Autoplay blocked — click the page to enable audio`, 'error');
                        });
                    }
                });
                
                room.on(RoomEvent.DataReceived, (payload, participant) => {
                    try {
                        const data = new TextDecoder().decode(payload);
                        const json = JSON.parse(data);
                        if (json.type === 'transcript') {
                            log(`📝 ${json.speaker}: "${json.text}"`, 
                                json.speaker === 'agent' ? 'agent' : 'user');
                        }
                    } catch (e) {
                        // Ignore
                    }
                });
                
                await room.connect(url, token);
                log(`📍 Connected to room: ${room.name}`, 'system');
                
                // Request microphone using LiveKit's proper API
                updateStatus('Requesting microphone...');
                localAudioTrack = await createLocalAudioTrack({
                    echoCancellation: false,   // ✅ Disable — can distort voice
                    noiseSuppression: false,   // ✅ Disable — can strip harmonics
                    autoGainControl: true      // ✅ Keep — normalizes volume
                });
                
                log(`🎙️ Microphone acquired`, 'system');
                
                await room.localParticipant.publishTrack(localAudioTrack);
                log('🎤 Microphone published — speak now!', 'user');
                updateStatus('Ready — Speak!');
                
            } catch (e) {
                log(`❌ Error: ${e.message}`, 'error');
                updateStatus('Error');
            }
        };
        
        // Disconnect
        document.getElementById('disconnectBtn').onclick = async () => {
            if (localAudioTrack) {
                localAudioTrack.stop();
                localAudioTrack = null;
            }
            if (room) {
                await room.disconnect();
                room = null;
            }
            updateStatus('Disconnected');
        };
        
        // Clear logs
        document.getElementById('clearBtn').onclick = () => {
            document.getElementById('logs').innerHTML = '';
            log('Logs cleared', 'system');
        };
        
        log('Page loaded — click Connect to start', 'system');
        log('💡 Click "Test Beep" first to verify audio works', 'system');
    </script>
</body>
</html>
