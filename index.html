<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf AI — Sandbox Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0F172A;
            --bg-card: #1E293B;
            --bg-hover: #334155;
            --text: #E2E8F0;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border: rgba(59,130,246,0.1);
            --accent: #3B82F6;
            --accent-hover: #2563EB;
            --green: #22C55E;
            --green-glow: rgba(34,197,94,0.2);
            --red: #EF4444;
            --yellow: #F59E0B;
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .gradient-text {
            background: linear-gradient(135deg, #3B82F6, #06B6D4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        /* Session Bar */
        .session-bar {
            display: flex;
            gap: 16px;
            background: var(--bg-card);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border);
            font-size: 12px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .status-badge.connected { color: var(--green); }
        .status-badge.disconnected { color: var(--red); }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background: var(--green); box-shadow: 0 0 8px var(--green); }
        .dot-red { background: var(--red); }
        
        /* Voice Panel */
        .voice-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }
        .voice-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .voice-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .voice-led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.1s;
        }
        .voice-led.idle { background: var(--text-muted); }
        .voice-led.listening { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1s infinite; }
        .voice-led.speaking { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 0.3s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .voice-status-text {
            font-size: 13px;
            font-weight: 500;
        }
        .stt-badge {
            background: var(--bg);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .stt-badge.cloud { color: var(--accent); }
        .stt-badge.local { color: var(--green); }
        .voice-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        
        /* Quick Actions */
        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        
        /* Chat Container */
        .chat-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 16px;
        }
        .messages {
            height: 350px;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: var(--bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message.error {
            align-self: center;
            background: rgba(239,68,68,0.1);
            border: 1px solid var(--red);
            color: var(--red);
            font-size: 11px;
        }
        .message.system {
            align-self: center;
            background: rgba(59,130,246,0.1);
            border: 1px solid var(--accent);
            color: var(--text-secondary);
            font-size: 11px;
        }
        .message pre {
            background: #0F172A;
            padding: 8px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 6px;
        }
        .input-area {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border);
            background: var(--bg-card);
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            outline: none;
        }
        .input-area input:focus { border-color: var(--accent); }
        .input-area input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* Upload Area */
        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 16px;
        }
        .upload-area:hover {
            border-color: var(--accent);
            background: var(--bg-hover);
        }
        .upload-area.drag-over {
            border-color: var(--green);
            background: var(--green-glow);
        }
        
        /* Settings Panel */
        .settings-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }
        details {
            cursor: pointer;
        }
        details summary {
            font-weight: 600;
            margin-bottom: 12px;
        }
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }
        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .setting-item label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        select, .setting-item select {
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-family: inherit;
            cursor: pointer;
        }
        
        button {
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { background: var(--bg-hover); }
        .btn-danger {
            background: var(--red);
            color: white;
        }
        .btn-sm { padding: 6px 12px; font-size: 11px; }
        
        /* Auth Section */
        .auth-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 16px;
        }
        .auth-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .auth-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
        }
        
        @media (max-width: 600px) {
            .message { max-width: 95%; }
            .session-bar { font-size: 10px; gap: 8px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <span class="gradient-text">🏄 Surf AI</span> Sandbox
            </h1>
            <div class="session-bar">
                <span class="status-badge" id="conn-status">
                    <span class="status-dot dot-red" id="conn-dot"></span>
                    <span id="conn-text">Disconnected</span>
                </span>
                <span>👤 <span id="user-email">surf@testuser.com</span></span>
                <span>💬 <span id="msg-count">0</span></span>
                <span>📊 <span id="plan">Free</span></span>
            </div>
        </div>

        <!-- Auth Section -->
        <div class="auth-section">
            <div class="auth-row">
                <input type="email" id="login-email" placeholder="Email" value="surf@testuser.com">
                <input type="password" id="login-password" placeholder="Password" value="Test1234!">
                <button class="btn-primary" onclick="login()">🔐 Login</button>
                <span id="auth-status" style="font-size:12px;color:var(--text-muted);"></span>
            </div>
        </div>

        <!-- Voice Panel -->
        <div class="voice-panel">
            <div class="voice-header">
                <div class="voice-indicator">
                    <div class="voice-led idle" id="voice-led"></div>
                    <span class="voice-status-text" id="voice-status-text">Ready</span>
                </div>
                <div class="stt-badge cloud" id="stt-badge">☁️ Cloud Mode</div>
            </div>
            <div class="voice-controls">
                <button class="btn-primary" onclick="startMic('ptt')">🎤 Push to Talk</button>
                <button class="btn-primary" onclick="startMic('vad')">🟢 VAD Mode</button>
                <button class="btn-danger" onclick="stopMic()">⏹️ Stop</button>
                <button class="btn-secondary" onclick="getStatus()">📊 Status</button>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
            <button class="btn-secondary" onclick="sendQuick('Hello')">👋 Hello</button>
            <button class="btn-secondary" onclick="sendQuick('What can you do?')">🆘 Help</button>
            <button class="btn-secondary" onclick="sendQuick('Tell me a joke')">😄 Joke</button>
            <button class="btn-secondary" onclick="clearChat()">🗑️ Clear</button>
            <button class="btn-secondary" onclick="exportChat()">📥 Export</button>
            <button class="btn-secondary" onclick="newChat()">🔄 New Session</button>
        </div>

        <!-- Chat Container -->
        <div class="chat-container">
            <div class="messages" id="chat-log"></div>
            <div class="input-area">
                <input type="text" id="message-input" placeholder="Type a message..." disabled>
                <button class="btn-primary" id="send-btn" disabled onclick="sendText()">Send</button>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="upload-area" id="upload-area">
            📁 Click or drag a file here to upload
            <input type="file" id="file-input" style="display:none" accept=".txt,.pdf,.docx,.md">
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel">
            <details>
                <summary>⚙️ Settings</summary>
                <div class="settings-grid">
                    <div class="setting-item">
                        <label>🔊 Voice</label>
                        <select id="voice-select">
                            <option value="en-US-AriaNeural">Aria (US English)</option>
                            <option value="en-US-JennyNeural">Jenny (US English)</option>
                            <option value="en-GB-SoniaNeural">Sonia (UK English)</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>🤖 Model</label>
                        <select id="model-select">
                            <option value="">Default</option>
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                            <option value="gpt-4">GPT-4</option>
                        </select>
                    </div>
                    <div class="setting-item">
                        <label>🔒 Privacy Mode</label>
                        <div class="auth-row" style="gap: 8px;">
                            <span id="privacy-status">Cloud</span>
                            <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                                <input type="checkbox" id="privacy-toggle" onchange="togglePrivacy()">
                                Enable Local STT
                            </label>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>🎨 Theme</label>
                        <select id="theme-select">
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                </div>
            </details>
        </div>
    </div>

    <!-- Sandbox Iframe -->
    <iframe id="sandbox" 
            src="https://sb-sf.vercel.app/" 
            allow="microphone; autoplay"
            style="position: absolute; width: 1px; height: 1px; border: none; opacity: 0;">
    </iframe>

    <script src="test.js"></script>
</body>
</html>
