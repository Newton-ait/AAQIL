<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surf Gateway - Debug Client</title>
    <style>
        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #00ffff;
            margin-bottom: 5px;
        }
        .status-bar {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            padding: 15px;
            background: #111;
            border: 1px solid #333;
            border-radius: 8px;
        }
        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .led {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff0000;
        }
        .led.on { background: #00ff00; box-shadow: 0 0 10px #00ff00; }
        .led.speaking { background: #ffaa00; box-shadow: 0 0 10px #ffaa00; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        button {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px 24px;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 10px;
        }
        button:hover {
            background: #00ff00;
            color: #000;
        }
        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        select {
            background: #1a1a1a;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 10px;
            font-family: monospace;
            border-radius: 4px;
        }
        .log-container {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            font-size: 13px;
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-time {
            color: #666;
            margin-right: 10px;
        }
        .log-info { color: #00ff00; }
        .log-warn { color: #ffaa00; }
        .log-error { color: #ff4444; }
        .log-success { color: #00ffff; font-weight: bold; }
        .transcript {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 10px;
            margin: 10px 0;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌊 Surf Gateway Debug Client</h1>
        <p style="color:#666; margin-top:0;">Gateway: https://surf-gateway.onrender.com</p>
        
        <div class="status-bar">
            <div class="status-item">
                <span class="led" id="ledGateway"></span>
                <span id="gatewayText">Gateway: Checking...</span>
            </div>
            <div class="status-item">
                <span class="led" id="ledSignal"></span>
                <span id="signalText">Signal: --</span>
            </div>
            <div class="status-item">
                <span class="led" id="ledMedia"></span>
                <span id="mediaText">Media: --</span>
            </div>
        </div>
        
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
            <button id="connectBtn" onclick="toggleConnection()">🔌 Connect</button>
            <button id="recordBtn" onclick="toggleRecording()" disabled>🎤 Record & Send REST</button>
            <select id="voiceSelect" style="width: 200px;">
                <option value="en-US-AriaNeural">Aria (US Female)</option>
                <option value="en-US-JennyNeural">Jenny (US Female)</option>
                <option value="en-US-GuyNeural">Guy (US Male)</option>
                <option value="en-GB-SoniaNeural">Sonia (UK Female)</option>
                <option value="en-GB-RyanNeural">Ryan (UK Male)</option>
            </select>
        </div>
        
        <div class="transcript" id="transcriptDisplay">
            📝 Transcript: <span id="transcriptText">--</span>
        </div>
        <div class="transcript" id="responseDisplay">
            🤖 Response: <span id="responseText">--</span>
        </div>
        
        <div class="log-container" id="logContainer">
            <div class="log-entry"><span class="log-time">[--:--:--]</span> <span class="log-info">Ready. Click Connect.</span></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mediasoup-client@3.6.0/dist/mediasoup-client.min.js"></script>
    
    <script>
        const GATEWAY_URL = 'https://surf-gateway.onrender.com';
        const SERVICE_PIN = 'ndu2026';
        
        let socket = null;
        let device = null;
        let producerTransport = null;
        let audioProducer = null;
        let localStream = null;
        let isConnected = false;
        let mediaRecorder = null;
        let audioChunks = [];
        
        // UI Elements
        const ledGateway = document.getElementById('ledGateway');
        const ledSignal = document.getElementById('ledSignal');
        const ledMedia = document.getElementById('ledMedia');
        const gatewayText = document.getElementById('gatewayText');
        const signalText = document.getElementById('signalText');
        const mediaText = document.getElementById('mediaText');
        const connectBtn = document.getElementById('connectBtn');
        const recordBtn = document.getElementById('recordBtn');
        const transcriptText = document.getElementById('transcriptText');
        const responseText = document.getElementById('responseText');
        const logContainer = document.getElementById('logContainer');
        
        // Logging
        function log(message, type = 'info') {
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-${type}">${message}</span>`;
            logContainer.appendChild(entry);
            logContainer.scrollTop = logContainer.scrollHeight;
            console.log(`[${type}] ${message}`);
        }
        
        // Health check
        async function checkHealth() {
            try {
                const res = await fetch(`${GATEWAY_URL}/health`);
                const data = await res.json();
                
                if (data.status === 'healthy' && data.mode === 'sfu') {
                    ledGateway.className = 'led on';
                    gatewayText.textContent = `Gateway: SFU Mode ✅`;
                    log(`Gateway healthy - Mode: ${data.mode}, Mediasoup: ${data.mediasoup}`, 'success');
                    return true;
                } else {
                    ledGateway.className = 'led';
                    gatewayText.textContent = `Gateway: ${data.mode || 'unknown'}`;
                    log(`Gateway mode: ${data.mode} (SFU: ${data.mediasoup})`, 'warn');
                    return false;
                }
            } catch (e) {
                ledGateway.className = 'led';
                gatewayText.textContent = 'Gateway: OFFLINE';
                log(`Gateway health check failed: ${e.message}`, 'error');
                return false;
            }
        }
        
        // Connection
        async function connect() {
            connectBtn.disabled = true;
            connectBtn.textContent = '🔄 Connecting...';
            
            const healthy = await checkHealth();
            if (!healthy) {
                log('Gateway not in SFU mode - WebRTC may fail', 'warn');
            }
            
            socket = io(GATEWAY_URL, {
                transports: ['websocket'],
                reconnection: true,
                reconnectionAttempts: 5
            });
            
            socket.on('connect', async () => {
                log('Socket.io connected', 'success');
                ledSignal.className = 'led on';
                signalText.textContent = 'Signal: Connected';
                
                try {
                    await setupMediasoup();
                    isConnected = true;
                    connectBtn.textContent = '🔴 Disconnect';
                    connectBtn.disabled = false;
                    recordBtn.disabled = false;
                    
                } catch (e) {
                    log(`Mediasoup setup failed: ${e.message}`, 'error');
                    signalText.textContent = 'Signal: Setup Failed';
                    connectBtn.textContent = '🔌 Connect';
                    connectBtn.disabled = false;
                }
            });
            
            socket.on('connect_error', (err) => {
                log(`Socket error: ${err.message}`, 'error');
                ledSignal.className = 'led';
                signalText.textContent = 'Signal: Error';
                connectBtn.textContent = '🔌 Connect';
                connectBtn.disabled = false;
            });
            
            socket.on('disconnect', () => {
                log('Socket disconnected', 'warn');
                ledSignal.className = 'led';
                signalText.textContent = 'Signal: Disconnected';
                isConnected = false;
            });
        }
        
        async function setupMediasoup() {
            log('Setting up Mediasoup device...', 'info');
            
            device = new mediasoupClient.Device();
            
            // Get router capabilities
            log('Requesting router RTP capabilities...', 'info');
            const caps = await new Promise((resolve, reject) => {
                socket.emit('getRouterRtpCapabilities', (response) => {
                    if (response.error) reject(new Error(response.error));
                    else resolve(response);
                });
            });
            
            await device.load({ routerRtpCapabilities: caps });
            log(`Device loaded - Codecs: ${caps.codecs?.map(c => c.mimeType).join(', ')}`, 'success');
            
            // Get microphone
            log('Requesting microphone access...', 'info');
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            const track = localStream.getAudioTracks()[0];
            log(`Microphone ready: ${track.label}`, 'success');
            
            // Create transport
            log('Creating producer transport...', 'info');
            const transportInfo = await new Promise((resolve, reject) => {
                socket.emit('createProducerTransport', (info) => {
                    if (info.error) reject(new Error(info.error));
                    else resolve(info);
                });
            });
            
            log(`Transport created - ID: ${transportInfo.id.slice(0, 20)}...`, 'success');
            
            // Log ICE candidates
            transportInfo.iceCandidates.forEach((c, i) => {
                log(`  ICE ${i+1}: ${c.ip}:${c.port} (${c.protocol}/${c.type})`, 'info');
            });
            
            producerTransport = device.createSendTransport({
                id: transportInfo.id,
                iceParameters: transportInfo.iceParameters,
                iceCandidates: transportInfo.iceCandidates,
                dtlsParameters: transportInfo.dtlsParameters
            });
            
            producerTransport.on('connect', async ({ dtlsParameters }, callback, errback) => {
                log('Transport connect event - sending DTLS...', 'info');
                socket.emit('connectProducerTransport', { dtlsParameters }, (response) => {
                    if (response.error) {
                        log(`DTLS connect failed: ${response.error}`, 'error');
                        errback(new Error(response.error));
                    } else {
                        log('DTLS connected', 'success');
                        callback();
                    }
                });
            });
            
            producerTransport.on('produce', async ({ kind, rtpParameters }, callback, errback) => {
                log(`Produce event - kind: ${kind}`, 'info');
                socket.emit('produce', { kind, rtpParameters }, (response) => {
                    if (response.error) {
                        log(`Produce failed: ${response.error}`, 'error');
                        errback(new Error(response.error));
                    } else {
                        log(`Producer created - ID: ${response.id.slice(0, 20)}...`, 'success');
                        callback({ id: response.id });
                    }
                });
            });
            
            producerTransport.on('connectionstatechange', (state) => {
                log(`Transport state: ${state}`, state === 'connected' ? 'success' : 'info');
                
                if (state === 'connected') {
                    ledMedia.className = 'led on';
                    mediaText.textContent = 'Media: UDP FLOWING ✅';
                    log('✅✅✅ UDP PACKETS FLOWING — RENDER FREE TIER WORKS!', 'success');
                } else if (state === 'failed') {
                    ledMedia.className = 'led';
                    mediaText.textContent = 'Media: Failed';
                    log('Transport failed', 'error');
                }
            });
            
            // Produce audio
            log('Producing audio track...', 'info');
            audioProducer = await producerTransport.produce({ 
                track: track,
                codecOptions: {
                    opusStereo: true,
                    opusDtx: true,
                    opusFec: true,
                    opusMaxPlaybackRate: 48000
                }
            });
            
            log(`Audio producer active - ID: ${audioProducer.id.slice(0, 20)}...`, 'success');
            ledMedia.className = 'led on';
            mediaText.textContent = 'Media: Ready';
        }
        
        function disconnect() {
            if (audioProducer) audioProducer.close();
            if (producerTransport) producerTransport.close();
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (socket) socket.disconnect();
            
            isConnected = false;
            ledSignal.className = 'led';
            ledMedia.className = 'led';
            signalText.textContent = 'Signal: --';
            mediaText.textContent = 'Media: --';
            connectBtn.textContent = '🔌 Connect';
            recordBtn.disabled = true;
            
            log('Disconnected', 'warn');
        }
        
        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }
        
        // Recording (REST fallback)
        async function toggleRecording() {
            if (mediaRecorder) {
                mediaRecorder.stop();
                mediaRecorder = null;
                recordBtn.textContent = '🎤 Record & Send REST';
                log('Recording stopped, sending to REST...', 'info');
            } else {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        stream.getTracks().forEach(t => t.stop());
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        await sendREST(blob);
                    };
                    
                    mediaRecorder.start();
                    recordBtn.textContent = '🔴 Stop Recording';
                    log('Recording started...', 'info');
                    
                } catch (e) {
                    log(`Recording failed: ${e.message}`, 'error');
                }
            }
        }
        
        async function sendREST(audioBlob) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'recording.wav');
            formData.append('voice', document.getElementById('voiceSelect').value);
            
            log('Sending to REST /voice endpoint...', 'info');
            
            try {
                const res = await fetch(`${GATEWAY_URL}/voice`, {
                    method: 'POST',
                    headers: { 'x-pin': SERVICE_PIN },
                    body: formData
                });
                
                const data = await res.json();
                
                if (data.transcript) {
                    transcriptText.textContent = data.transcript;
                    log(`Transcript: "${data.transcript}"`, 'success');
                }
                
                if (data.response) {
                    responseText.textContent = data.response;
                    log(`Response: "${data.response}"`, 'success');
                }
                
                if (data.audio_base64) {
                    const bytes = Uint8Array.from(data.audio_base64.match(/.{1,2}/g).map(b => parseInt(b, 16)));
                    const audio = new Audio(URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' })));
                    audio.play();
                    log('Playing TTS audio...', 'info');
                }
                
            } catch (e) {
                log(`REST failed: ${e.message}`, 'error');
            }
        }
        
        // Startup
        window.onload = () => {
            checkHealth();
            log('Debug client ready', 'info');
        };
    </script>
</body>
</html>
